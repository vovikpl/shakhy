// =================== АНГЛІЙСЬКА: ДУЕЛЬ І КВЕСТ ===================
const EN_TOTAL = 10;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const canSpeak = () => { try { return !!(NET.canSpeak && NET.canSpeak()); } catch(e) { return false; } };
const myLevel = () => { try { return +(JSON.parse(localStorage.getItem('en_quest') || '{}').level) || 0; } catch(e) { return 0; } };

// Питання трьох видів: pic — картинка і слово; listen — почути слово; spell — скласти слово з літер
function makeQuestion(lvl, topicIds, o){
  o = o || {};
  const pool = [].concat(...topicIds.map(t => TOPICS[t].w));
  const levelPool = [].concat(...LEVEL_TOPICS[lvl].map(t => TOPICS[t].w));
  const used = o.used || [];
  let w = null;
  if (o.prefer && o.prefer.length) {
    const en = o.prefer.shift();
    w = levelPool.find(x => x.en === en) || null;
  }
  if (!w) {
    const free = pool.filter(x => !used.includes(x.t + ':' + x.en));
    const src = free.length ? free : pool;
    w = src[Math.floor(Math.random() * src.length)];
  }
  used.push(w.t + ':' + w.en);
  const maxLen = lvl === 1 ? 0 : lvl === 2 ? 6 : 10;
  const spellable = /^[a-z]+$/.test(w.en) && w.en.length >= 3 && w.en.length <= maxLen;
  const r = Math.random();
  let type = 'pic';
  const pSpell = o.boss ? 0.45 : lvl === 2 ? 0.25 : lvl === 3 ? 0.35 : 0;
  const pListen = o.listen ? (lvl === 1 ? 0.3 : 0.2) : 0;
  if (spellable && r < pSpell) type = 'spell';
  else if (r < pSpell + pListen) type = 'listen';
  const q = { type, lvl, e: w.e, en: w.en, ua: w.ua, t: w.t };
  if (type === 'spell') {
    const extra = lvl === 3 ? 2 : 0, abc = 'abcdefghijklmnoprstuwy';
    const letters = w.en.split('');
    for (let i = 0; i < extra; i++) letters.push(abc[Math.floor(Math.random() * abc.length)]);
    q.tiles = shuffle(letters);
    return q;
  }
  const n = EN_LVL[lvl].opts;
  const okDistr = x => x.en.toLowerCase() !== w.en.toLowerCase() && x.ua !== w.ua && (type !== 'listen' || lvl !== 1 || x.e !== w.e);
  let distr = shuffle(TOPICS[w.t].w.filter(okDistr));
  if (distr.length < n - 1) distr = distr.concat(shuffle(levelPool.filter(x => okDistr(x) && !distr.includes(x))));
  const picked = [];
  for (const x of distr) {
    if (picked.length >= n - 1) break;
    if (picked.some(p => p.en === x.en || p.ua === x.ua || (type === 'listen' && lvl === 1 && p.e === x.e))) continue;
    picked.push(x);
  }
  const opts = shuffle(picked.concat([w])).map(x => ({ e: x.e, en: x.en, ua: x.ua }));
  q.dir = type === 'listen' ? 'listen' : (Math.random() < .5 ? 'en2ua' : 'ua2en');
  q.opts = opts; q.ok = opts.findIndex(x => x.en === w.en);
  return q;
}

const EN = {
  st: null, timer: null,
  active(){ return !!this.st; },
  stop(){ clearTimeout(this.timer); this.st = null; },
  leaveFree(){ return !this.st || this.st.phase === 'over' || this.st.k < 1; },
  me(){ return this.st && this.st.mode === 'net' ? S.role : 'host'; },
  opp(){ return this.me() === 'host' ? 'client' : 'host'; },
  fresh(mode){
    return { mode, total: EN_TOTAL, k: -1, q: null, qc: null, phase: 'wait', ans: { host: null, client: null },
             winner: null, score: { host: 0, client: 0 }, used: [], note: '', sp: null, t0: Date.now(),
             lvlOpt: '2', lvl: { host: 2, client: 2 }, res: [], mist: 0 };
  },

  // ---------- Дуель ----------
  hostStart(opt){
    this.stop(); const st = this.st = this.fresh('net');
    st.lvlOpt = opt || 'own';
    const mine = myLevel() || 2;
    st.lvl = st.lvlOpt === 'own' ? { host: mine, client: null } : { host: +st.lvlOpt, client: +st.lvlOpt };
    send({ t:'start', game:'en', lvlOpt: st.lvlOpt, hostLvl: st.lvl.host, name: S.myName });
    enterGame(); this.timer = setTimeout(() => this.nextQ(), 1200);
  },
  clientStart(m){
    this.stop(); const st = this.st = this.fresh('net');
    st.lvlOpt = m.lvlOpt || '2';
    st.lvl = { host: m.hostLvl || 2, client: st.lvlOpt === 'own' ? (myLevel() || 2) : +st.lvlOpt };
    send({ t:'en_lvl', lvl: st.lvl.client });
    enterGame();
  },
  newRound(){
    const old = this.st; if (!old) return;
    const st = this.st = this.fresh(old.mode);
    st.lvlOpt = old.lvlOpt; st.lvl = old.lvl;
    closeModal(); S.rematchAsked = false; this.render();
    if (S.role === 'host') this.timer = setTimeout(() => this.nextQ(), 900);
  },
  nextQ(){
    const st = this.st; if (!st || st.mode !== 'net') return;
    if (!S.connected || st.lvl.client == null) { this.timer = setTimeout(() => this.nextQ(), 600); return; }
    if (st.k + 1 >= st.total) return this.finish();
    st.k++;
    const same = st.lvl.host === st.lvl.client;
    st.q = makeQuestion(st.lvl.host, LEVEL_TOPICS[st.lvl.host], { used: st.used });
    st.qc = same ? st.q : makeQuestion(st.lvl.client, LEVEL_TOPICS[st.lvl.client], { used: st.used });
    st.phase = 'q'; st.ans = { host: null, client: null }; st.winner = null; st.note = '';
    st.sp = st.q.type === 'spell' ? { pos: 0, used: [], wrong: 0, bad: -1 } : null;
    send({ t:'en_q', k: st.k, q: st.qc, same, score: st.score });
    this.showQ();
    clearTimeout(this.timer);
    const long = st.q.type === 'spell' || st.qc.type === 'spell';
    this.timer = setTimeout(() => this.resolve(), long ? 30000 : 15000);
  },
  answer(role, o){                                  // лише на головному телефоні
    const st = this.st;
    if (!st || st.phase !== 'q' || st.ans[role] != null) return;
    st.ans[role] = o;
    const q = role === 'host' ? st.q : st.qc;
    if (o === 'done' || o === q.ok) { st.winner = role; this.resolve(); return; }
    if (st.ans.host != null && st.ans.client != null) this.resolve();
    else this.render();
  },
  resolve(){
    const st = this.st;
    if (!st || st.phase !== 'q') return;
    clearTimeout(this.timer);
    st.phase = 'r';
    if (st.winner) st.score[st.winner]++;
    send({ t:'en_r', k: st.k, winner: st.winner, ans: st.ans, score: st.score });
    this.showReveal();
    this.timer = setTimeout(() => this.nextQ(), st.winner ? 1900 : 2700);
  },
  finish(){
    const st = this.st; if (!st) return;
    clearTimeout(this.timer);
    st.phase = 'over';
    if (S.role === 'host') send({ t:'en_end', score: st.score });
    this.render();
    setTimeout(() => this.showResult(), 500);
  },
  showResult(){
    const st = this.st;
    if (!st || st.phase !== 'over' || S.modalKind || st.mode !== 'net') return;
    const a = st.score[this.me()], b = st.score[this.opp()];
    const title = a > b ? 'Перемога! 🏆' : a < b ? `Переміг ${esc(S.oppName)}` : 'Нічия 🤝';
    ask('result', title, `Рахунок ${a} : ${b}`, [{ label:'Ще раз', cls:'gold', fn: rematch }, { label:'В меню', fn: toMenu }]);
  },
  sendState(){
    const st = this.st;
    send({ t:'state', game:'en', lvlOpt: st.lvlOpt, lvl: st.lvl, k: st.k, q: st.qc, phase: st.phase, ans: st.ans,
           winner: st.winner, score: st.score, name: S.myName });
  },
  onState(m){
    if (!this.st) this.st = this.fresh('net');
    const st = this.st;
    Object.assign(st, { lvlOpt: m.lvlOpt, k: m.k, phase: m.phase, ans: m.ans || { host:null, client:null },
                        winner: m.winner, score: m.score || { host:0, client:0 } });
    if (m.lvl) st.lvl = { host: m.lvl.host, client: st.lvl.client || m.lvl.client };
    if (!st.q || !m.q || st.q.en !== m.q.en) { st.q = m.q; st.sp = m.q && m.q.type === 'spell' ? { pos: 0, used: [], wrong: 0, bad: -1 } : null; }
    send({ t:'en_lvl', lvl: st.lvl.client || myLevel() || 2 });
    const was = inGame();
    enterGame();
    if (was) toast('Зв’язок відновлено');
  },
  onMsg(m){
    const st = this.st; if (!st) return;
    switch (m.t) {
      case 'en_lvl': if (S.role === 'host') st.lvl.client = m.lvl || 2; break;
      case 'en_q':
        st.k = m.k; st.q = m.q; st.phase = 'q'; st.ans = { host: null, client: null }; st.same = m.same;
        st.winner = null; st.score = m.score; st.note = '';
        st.sp = m.q.type === 'spell' ? { pos: 0, used: [], wrong: 0, bad: -1 } : null;
        this.showQ(); break;
      case 'en_a': if (S.role === 'host' && m.k === st.k) this.answer('client', m.o); break;
      case 'en_r':
        if (m.k !== st.k) return;
        st.phase = 'r'; st.winner = m.winner; st.ans = m.ans; st.score = m.score;
        this.showReveal(); break;
      case 'en_end': st.score = m.score; if (st.phase !== 'over') this.finish(); break;
    }
  },

  // ---------- Квест (один гравець) ----------
  startQuest(lvl, idx, review){
    this.stop();
    const st = this.st = this.fresh('quest');
    const stations = questStations(lvl);
    st.qlvl = lvl; st.idx = idx; st.review = !!review;
    st.station = review ? { kind: 'review', topics: LEVEL_TOPICS[lvl] } : stations[idx];
    st.total = review ? Math.min(8, EQ.mistakes(lvl).length) : st.station.kind === 'boss' ? 8 : 6;
    st.prefer = review ? shuffle(EQ.mistakes(lvl)) : [];
    S.mode = 'local'; S.gameType = 'en';
    enterGame(); this.timer = setTimeout(() => this.nextQ1(), 500);
  },
  nextQ1(){
    const st = this.st; if (!st || st.mode !== 'quest') return;
    if (st.k + 1 >= st.total) return this.finishQuest();
    st.k++;
    st.q = makeQuestion(st.qlvl, st.station.topics, { used: st.used, listen: canSpeak(), boss: st.station.kind === 'boss', prefer: st.prefer });
    st.phase = 'q'; st.ans = { host: null, client: null }; st.winner = null; st.note = '';
    st.sp = st.q.type === 'spell' ? { pos: 0, used: [], wrong: 0, bad: -1 } : null;
    this.showQ();
  },
  answer1(o){
    const st = this.st; if (!st || st.phase !== 'q') return;
    st.ans.host = o;
    const ok = o === 'done' ? (st.sp.wrong < 3) : o === st.q.ok;
    st.res.push(ok);
    if (ok) { EQ.forget(st.qlvl, st.q.en); st.winner = 'host'; }
    else { st.mist++; EQ.remember(st.qlvl, st.q.en); }
    st.phase = 'r';
    st.note = ok ? ['Чудово! 🎉', 'Правильно! ⭐', 'Супер! 💪', 'Так тримати! 🚀'][Math.floor(Math.random() * 4)]
                 : `Правильно: ${st.q.en} — ${st.q.ua}`;
    if (st.q.type !== 'pic' || st.q.dir === 'ua2en' || !ok) this.say(st.q.en);
    NET.vibrate(ok ? 40 : 120);
    this.render();
    this.timer = setTimeout(() => this.nextQ1(), ok ? 1300 : 2600);
  },
  finishQuest(){
    const st = this.st; if (!st) return;
    st.phase = 'over'; this.render();
    if (st.review) {
      setTimeout(() => ask('result', 'Повторення завершено 🔁', `Правильно ${st.res.filter(Boolean).length} з ${st.total}. Слова, які ти вже знаєш, зникли зі списку помилок.`,
        [{ label:'До карти', cls:'gold', fn: () => EQ.open() }]), 400);
      return;
    }
    const boss = st.station.kind === 'boss';
    const m = st.mist;
    const stars = boss ? (m === 0 ? 3 : m <= 2 ? 2 : m <= 4 ? 1 : 0) : (m === 0 ? 3 : m <= 1 ? 2 : m <= 3 ? 1 : 0);
    const r = EQ.complete(st.qlvl, st.idx, stars);
    setTimeout(() => EQ.showResult(st.qlvl, st.idx, stars, r, st), 400);
  },

  // ---------- Спільне ----------
  showQ(){
    const q = this.st.q;
    if (q && (q.type === 'listen' || (q.type === 'pic' && q.dir === 'en2ua'))) this.say(q.en);
    this.render();
  },
  showReveal(){
    const st = this.st, q = st.q, me = this.me();
    if (st.winner === me) st.note = 'Ти перший! +1 🎉';
    else if (st.winner) st.note = `${S.oppName} відповів швидше`;
    else st.note = `Ніхто не вгадав. Правильно: ${q.en} — ${q.ua}`;
    if (q.type !== 'pic' || q.dir === 'ua2en' || !st.winner) this.say(q.en);
    NET.vibrate(st.winner === me ? 60 : 20);
    this.render();
  },
  say(text){ try { if (NET.speak) NET.speak(text); } catch(e) {} },
  click(o){
    const st = this.st;
    if (!st || st.phase !== 'q') return;
    if (st.mode === 'quest') return this.answer1(o);
    if (!S.connected) return;
    const me = this.me();
    if (st.ans[me] != null) return;
    if (S.role === 'host') { this.answer(me, o); return; }
    st.ans[me] = o;
    send({ t:'en_a', k: st.k, o });
    st.note = (o === 'done' || o === st.q.ok) ? 'Правильно! Чекаю, хто був першим…' : 'Ой, не те слово';
    this.render();
  },
  tile(i){
    const st = this.st, sp = st && st.sp;
    if (!sp || st.phase !== 'q' || sp.used.includes(i) || st.ans[this.me()] != null) return;
    const want = st.q.en[sp.pos], ch = st.q.tiles[i];
    if (ch === want) {
      sp.used.push(i); sp.pos++; sp.bad = -1;
      if (sp.pos >= st.q.en.length) { this.click('done'); return; }
    } else { sp.wrong++; sp.bad = i; NET.vibrate(30); }
    this.render();
  },

  // ---------- Екран ----------
  render(){
    const st = this.st, el = $('enBody'); if (!st || !el) return;
    const quest = st.mode === 'quest', me = this.me(), op = this.opp();
    let h = '<div class="enbar">';
    if (quest) {
      const name = st.review ? '🔁 Повторення' : (st.station.kind === 'boss' ? BOSSES[Math.floor(st.idx / 4)].ic + ' ' + BOSSES[Math.floor(st.idx / 4)].n : TOPICS[st.station.topics[0]].ic + ' ' + TOPICS[st.station.topics[0]].n);
      h += `<div class="pl"><span class="nm">${esc(name)}</span></div><div class="dots">`;
      for (let i = 0; i < st.total; i++) h += `<i class="${i < st.res.length ? (st.res[i] ? 'g' : 'r') : i === st.k ? 'c' : ''}"></i>`;
      h += '</div>';
    } else {
      h += `<div class="pl"><span class="nm">${esc(S.myName)} ${EN_LVL[st.lvl[me] || 2].ic}</span><b>${st.score[me]}</b></div>`;
      h += `<div class="prog">${Math.max(0, st.k + 1)} / ${st.total}</div>`;
      h += `<div class="pl r"><b>${st.score[op]}</b><span class="nm">${esc(S.oppName)} ${st.lvl[op] ? EN_LVL[st.lvl[op]].ic : ''}</span></div>`;
    }
    h += '</div>';
    const q = st.q;
    if (!q || st.phase === 'wait') {
      h += `<div class="encard"><div class="emo">${quest ? '🦜' : '🇬🇧'}</div><div class="ask">${!quest && !S.connected ? 'Немає зв’язку' : 'Приготуйся…'}</div></div>`;
    } else if (q.type === 'spell') {
      const sp = st.sp || { pos: 0, used: [], wrong: 0, bad: -1 };
      const done = st.phase !== 'q';
      h += `<div class="encard"><div class="emo">${q.e}</div><div class="word">${esc(q.ua)}</div><div class="ask">Склади слово англійською</div>`;
      h += '<div class="slots">' + q.en.split('').map((c, i) => `<span class="${i < sp.pos || done ? 'f' : ''}">${i < sp.pos || done ? c : ''}</span>`).join('') + '</div></div>';
      const hint = sp.wrong >= 3 && !done ? q.tiles.findIndex((c, i) => c === q.en[sp.pos] && !sp.used.includes(i)) : -1;
      h += '<div class="tiles">' + q.tiles.map((c, i) => `<button data-t="${i}" class="${sp.used.includes(i) ? 'used' : ''} ${sp.bad === i ? 'bad' : ''} ${hint === i ? 'hint' : ''}" ${done || sp.used.includes(i) ? 'disabled' : ''}>${c}</button>`).join('') + '</div>';
    } else {
      const listen = q.type === 'listen';
      if (listen) h += `<div class="encard"><button class="bigspk" data-say="1">🔊</button><div class="ask">Послухай і вибери правильне${q.lvl === 1 ? ' зображення' : ' слово'}</div></div>`;
      else {
        const show = q.dir === 'en2ua' ? q.en : q.ua;
        const canSay = q.dir === 'en2ua' || st.phase !== 'q';
        h += `<div class="encard"><div class="emo">${q.e}</div><div class="word">${esc(show)}${canSay ? ' <button class="spk" data-say="1">🔊</button>' : ''}</div>` +
             `<div class="ask">${q.dir === 'en2ua' ? 'Як це українською?' : 'Як це англійською?'}</div></div>`;
      }
      const emojiOpts = listen && q.lvl === 1;
      h += `<div class="opts ${emojiOpts ? 'emo' : ''} n${q.opts.length}">`;
      q.opts.forEach((o, k) => {
        const txt = emojiOpts ? o.e : listen ? o.en : q.dir === 'en2ua' ? o.ua : o.en;
        let cls = '';
        const mine = st.ans[me] === k, theirs = !quest && st.same && st.ans[op] === k;
        if (st.phase !== 'q') { if (k === q.ok) cls = 'ok'; else if (mine) cls = 'bad'; }
        else if (mine) cls = k === q.ok ? 'ok' : 'bad';
        const dis = st.phase !== 'q' || st.ans[me] != null;
        const tags = (!quest && mine ? '<i>ти</i>' : '') + (theirs && st.phase !== 'q' ? `<i>${esc(S.oppName)}</i>` : '');
        h += `<button data-o="${k}" class="${cls}" ${dis ? 'disabled' : ''}>${esc(txt)}${tags}</button>`;
      });
      h += '</div>';
    }
    h += `<div class="ennote">${esc(st.note || '')}</div>`;
    const acts = !quest && st.phase === 'over'
      ? [['again', S.rematchAsked ? '⏳' : '🔁', S.rematchAsked ? 'Чекаю…' : 'Ще раз', true], ['result', '🏁', 'Результат'], ['menu', '☰', 'Меню']]
      : [['menu', quest ? '🗺️' : '☰', quest ? 'Карта' : 'Меню']];
    h += `<div class="actions" style="width:min(94vw,420px)">` + acts.map(([id, ic, lb, gold]) =>
      `<button data-a="${id}" class="${gold ? 'gold' : ''}"><span>${ic}</span>${lb}</button>`).join('') + '</div>';
    el.innerHTML = h;
  }
};
$('enBody').addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t) { if (!t.disabled) EN.tile(+t.dataset.t); return; }
  const o = e.target.closest('[data-o]');
  if (o) { if (!o.disabled) EN.click(+o.dataset.o); return; }
  if (e.target.closest('[data-say]')) { if (EN.st && EN.st.q) EN.say(EN.st.q.en); return; }
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'menu') {
    if (EN.st && EN.st.mode === 'quest') {
      if (EN.st.k < 1 || EN.st.phase === 'over') { EN.stop(); EQ.open(); }
      else ask('leave', 'Повернутися на карту?', 'Прогрес цього острова не збережеться.', [
        { label:'На карту', cls:'gold', fn: () => { EN.stop(); EQ.open(); } }, { label:'Грати далі' }]);
    } else confirmLeave();
  }
  else if (a.dataset.a === 'again') rematch();
  else if (a.dataset.a === 'result') EN.showResult();
});

// =================== КВЕСТ «ОСТРІВ СКАРБІВ» ===================
const EQ = {
  load(){
    let d; try { d = JSON.parse(localStorage.getItem('en_quest') || '{}'); } catch(e) { d = {}; }
    d.p = d.p || {}; d.mist = d.mist || {};
    for (const l of [1, 2, 3]) { d.p[l] = d.p[l] || Array(12).fill(0); d.mist[l] = d.mist[l] || []; }
    return d;
  },
  save(d){ try { localStorage.setItem('en_quest', JSON.stringify(d)); } catch(e) {} },
  mistakes(l){ return this.load().mist[l]; },
  remember(l, en){ const d = this.load(); if (!d.mist[l].includes(en)) d.mist[l].push(en); d.mist[l] = d.mist[l].slice(-40); this.save(d); },
  forget(l, en){ const d = this.load(); d.mist[l] = d.mist[l].filter(x => x !== en); this.save(d); },
  complete(l, idx, stars){
    const d = this.load(), old = d.p[l][idx];
    d.p[l][idx] = Math.max(old, stars); this.save(d);
    return { firstSticker: stars > 0 && old === 0, improved: stars > old };
  },
  open(){
    S.mode = 'local'; S.gameType = 'en';
    const d = this.load();
    if (!d.level) { this.pickLevel(true); return; }
    this.view = 'map';
    show('enquest'); this.render();
    setTimeout(() => { const n = document.querySelector('.qnode.next'); if (n && n.scrollIntoView) n.scrollIntoView({ block: 'center' }); }, 50);
  },
  pickLevel(first){
    show('enquest');
    const html = `<h3>${first ? 'Привіт! Я папуга Кеша 🦜' : 'Хто грає?'}</h3><p>${first ? 'Вибери свій рівень, і вирушаємо шукати скарб!' : 'Кожен рівень має свою карту і свої наліпки.'}</p><div class="btns">` +
      [1, 2, 3].map(l => `<button class="btn ${l === 2 ? 'gold' : ''}" data-l="${l}">${EN_LVL[l].ic} ${EN_LVL[l].name} · ${EN_LVL[l].age}</button>`).join('') + '</div>';
    modal('level', html, card => card.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      const d = this.load(); d.level = +b.dataset.l; this.save(d); closeModal(); this.open();
    }));
  },
  render(){
    const d = this.load(), l = d.level || 1, el = $('eqBody');
    if (!el) return;
    const p = d.p[l], stars = p.reduce((a, b) => a + b, 0);
    let h = `<div class="eqtop"><button class="chip" data-q="level">${EN_LVL[l].ic} ${EN_LVL[l].name} ▾</button>` +
            `<span class="chip">⭐ ${stars}</span><button class="chip" data-q="album">📒 Наліпки</button><button class="chip" data-q="menu">☰</button></div>`;
    if (this.view === 'album') {
      h += '<div class="album"><h2>Мої наліпки</h2>';
      for (const lv of [1, 2, 3]) {
        h += `<div class="alv">${EN_LVL[lv].ic} ${EN_LVL[lv].name}</div><div class="agrid">` +
             STICKERS[lv].map((s, i) => `<span class="${d.p[lv][i] ? '' : 'lock'}">${d.p[lv][i] ? s : '❔'}</span>`).join('') + '</div>';
      }
      h += `<button class="btn gold" data-q="map" style="margin-top:12px">🗺️ До карти</button></div>`;
      el.innerHTML = h; return;
    }
    const stations = questStations(l), next = p.findIndex(x => x === 0);
    const done = next === -1;
    h += `<div class="parrot"><span>🦜</span><p>${done ? 'Ура! Скарб знайдено! Можеш покращити зірки або спробувати інший рівень.' :
          next === 0 ? 'Привіт! Пірати сховали скарб. Пройди всі острови — і він твій!' :
          'Молодець! Пливемо до наступного острова.'}</p></div>`;
    const mist = d.mist[l].length;
    if (mist) h += `<button class="review" data-q="review">🔁 Повторити слова з помилками (${mist})</button>`;
    h += '<div class="qmap">';
    stations.forEach((s, i) => {
      const open = i === 0 || p[i - 1] > 0;
      const boss = s.kind === 'boss';
      const ic = !open ? '🔒' : boss ? (s.final ? '🧰' : BOSSES[Math.floor(i / 4)].ic) : TOPICS[s.topics[0]].ic;
      const name = boss ? (s.final ? 'Скарб' : BOSSES[Math.floor(i / 4)].n) : TOPICS[s.topics[0]].n;
      const st = p[i] ? '⭐'.repeat(p[i]) + '☆'.repeat(3 - p[i]) : '';
      h += `<button class="qnode ${i % 2 ? 'r' : 'l'} ${open ? '' : 'locked'} ${boss ? 'boss' : ''} ${i === next ? 'next' : ''}" data-s="${i}" ${open ? '' : 'disabled'}>` +
           `<span class="qic">${ic}</span><span class="qtx"><b>${esc(name)}</b><small>${st || (open ? 'Відкрито' : '')}</small></span></button>`;
    });
    h += '</div>';
    el.innerHTML = h;
  },
  startStation(i){
    const l = this.load().level, s = questStations(l)[i];
    const boss = s.kind === 'boss', B = BOSSES[Math.floor(i / 4)];
    const title = boss ? `${B.ic} ${B.n}` : `${TOPICS[s.topics[0]].ic} ${TOPICS[s.topics[0]].n}`;
    const story = boss ? B.story : TOPICS[s.topics[0]].story;
    ask('station', esc(title), `🦜 ${esc(story)}<br><br>${boss ? '8 питань, серед них — скласти слово з літер.' : '6 питань.'} Помилок не більше ${boss ? 4 : 3}, щоб пройти далі.`,
      [{ label:'Вирушаємо! ⛵', cls:'gold', fn: () => EN.startQuest(l, i) }, { label:'Назад' }]);
  },
  showResult(l, idx, stars, r, st){
    const sticker = STICKERS[l][idx], final = idx === 11;
    let title, text;
    if (stars === 0) { title = 'Ще трохи! 💪'; text = `Помилок: ${st.mist}. Спробуй ще раз — у тебе вийде!`; }
    else if (final && r.firstSticker) { title = 'СКАРБ ЗНАЙДЕНО! 👑'; text = `${'⭐'.repeat(stars)}<br>Ти пройшов усю карту рівня «${EN_LVL[l].name}»! Нагорода: ${sticker}`; }
    else { title = '⭐'.repeat(stars) + '☆'.repeat(3 - stars); text = r.firstSticker ? `Острів пройдено! Нова наліпка: <span style="font-size:40px">${sticker}</span>` : (r.improved ? 'Новий рекорд зірок!' : 'Острів пройдено!'); }
    modal('result', `<h3>${title}</h3><p>${text}</p><div class="btns">` +
      `<button class="btn gold" data-x="map">🗺️ До карти</button><button class="btn" data-x="again">🔁 Ще раз</button></div>`, card => {
      card.querySelector('[data-x="map"]').onclick = () => { closeModal(); EN.stop(); this.open(); };
      card.querySelector('[data-x="again"]').onclick = () => { closeModal(); EN.startQuest(l, idx); };
    });
    if (stars > 0) NET.vibrate(final ? 400 : 150);
  }
};
$('eqBody').addEventListener('click', e => {
  const s = e.target.closest('[data-s]');
  if (s) { if (!s.disabled) EQ.startStation(+s.dataset.s); return; }
  const b = e.target.closest('[data-q]'); if (!b) return;
  const a = b.dataset.q;
  if (a === 'menu') toMenu();
  else if (a === 'level') EQ.pickLevel(false);
  else if (a === 'album') { EQ.view = 'album'; EQ.render(); }
  else if (a === 'map') { EQ.view = 'map'; EQ.render(); }
  else if (a === 'review') EN.startQuest(EQ.load().level, 0, true);
});

// =================== ТАНЧИКИ ===================
// Головний телефон рахує всю фізику (30 разів на секунду) і розсилає стан;
// другий телефон лише надсилає свої кнопки і малює те, що прийшло.
const TK_N = 13;
const TK_MAP = [
  '..b.s...s.b..',
  '.bb.b...b.bb.',
  '.....b.b.....',
  's.bb.....bb.s',
  '....ww.ww....',
  '.b.b..b..b.b.',
  '..s..bbb..s..',
  '.b.b..b..b.b.',
  '....ww.ww....',
  's.bb.....bb.s',
  '.....b.b.....',
  '.bb.b...b.bb.',
  '..b.s...s.b..'
].join('');
const TK_DX = [0, 1, 0, -1], TK_DY = [-1, 0, 1, 0];
const TK_COL = ['#e6b450', '#5aa9e6'];
const TK_HALF = 0.42, TK_SPEED = 3.2, TK_BULLET = 9;

const TK = {
  st: null, loop: null, raf: null, tick: 0, botT: 0, botLast: null,
  myD: -1, myF: 0, smooth: null, resyncF: false,
  active(){ return !!this.st; },
  stop(){
    clearInterval(this.loop); this.loop = null;
    cancelAnimationFrame(this.raf); this.raf = null;
    this.st = null; this.smooth = null; this.myD = -1;
  },
  leaveFree(){ return !this.st || !!this.st.over || (this.st.sc[0] + this.st.sc[1] === 0 && this.st.ph === 'ready'); },
  meIdx(){ return S.mode === 'net' && S.role === 'client' ? 1 : 0; },
  isSim(){ return S.mode === 'local' || S.role === 'host'; },

  spawn(){ return [{ x: 6.5, y: 12.5, d: 0, alive: true, cd: 0 }, { x: 6.5, y: 0.5, d: 2, alive: true, cd: 0 }]; },
  fresh(mode, target){
    return { mode, target, sc: [0, 0], ph: 'ready', phT: 1.5, map: TK_MAP, tanks: this.spawn(), bullets: [], fx: [],
             inp: [{ d: -1, f: 0, lf: 0 }, { d: -1, f: 0, lf: 0 }], over: null };
  },

  // ---------- Старт ----------
  startLocal(){ this.stop(); this.st = this.fresh('local', 5); this.begin(); },
  hostStart(target){
    this.stop(); this.st = this.fresh('net', target);
    send({ t:'start', game:'tk', target, name: S.myName });
    this.begin();
  },
  clientStart(m){ this.stop(); this.st = this.fresh('net', m.target || 5); this.st.view = null; this.begin(); },
  begin(){
    this.myD = -1; this.myF = 0; this.smooth = null;
    enterGame(); this.resize();
    if (this.isSim()) { this.tick = 0; this.loop = setInterval(() => this.step(1 / 30), 33); }
    const frame = () => { this.draw(); this.raf = requestAnimationFrame(frame); };
    this.raf = requestAnimationFrame(frame);
  },
  newRound(){
    const target = this.st ? this.st.target : 5, mode = this.st ? this.st.mode : S.mode;
    this.stop(); this.st = this.fresh(mode, target);
    closeModal(); S.rematchAsked = false; this.begin();
  },

  // ---------- Фізика (лише на головному телефоні) ----------
  cell(x, y){
    const c = Math.floor(x), r = Math.floor(y);
    if (c < 0 || r < 0 || c >= TK_N || r >= TK_N) return '#';
    return this.st.map[r * TK_N + c];
  },
  blocked(x, y, k){
    const s = this.st, h = TK_HALF;
    if (x - h < 0 || y - h < 0 || x + h > TK_N || y + h > TK_N) return true;
    for (let r = Math.floor(y - h); r <= Math.floor(y + h - 1e-6); r++)
      for (let c = Math.floor(x - h); c <= Math.floor(x + h - 1e-6); c++) {
        const ch = s.map[r * TK_N + c];
        if (ch === 'b' || ch === 's' || ch === 'w') return true;
      }
    const o = s.tanks[1 - k];
    if (o.alive && Math.abs(o.x - x) < 2 * h && Math.abs(o.y - y) < 2 * h) return true;
    return false;
  },
  moveTank(k, d, dt){
    const t = this.st.tanks[k];
    if (d !== t.d) {
      if ((d % 2) !== (t.d % 2)) {                     // поворот на 90°: вирівнюємо по центру клітинки
        const ox = t.x, oy = t.y;
        if (d % 2 === 0) t.x = Math.round(t.x - 0.5) + 0.5; else t.y = Math.round(t.y - 0.5) + 0.5;
        if (this.blocked(t.x, t.y, k)) { t.x = ox; t.y = oy; }
      }
      t.d = d;
    }
    let f = 1;
    while (f > 0.06) {
      const nx = t.x + TK_DX[d] * TK_SPEED * dt * f, ny = t.y + TK_DY[d] * TK_SPEED * dt * f;
      if (!this.blocked(nx, ny, k)) { t.x = nx; t.y = ny; return; }
      f /= 2;
    }
  },
  fire(k){
    const s = this.st, t = s.tanks[k];
    if (!t.alive || t.cd > 0 || s.bullets.filter(b => b.o === k).length >= 2) return;
    t.cd = 0.4;
    s.bullets.push({ x: t.x + TK_DX[t.d] * 0.5, y: t.y + TK_DY[t.d] * 0.5, d: t.d, o: k });
  },
  step(dt){
    const s = this.st; if (!s) return;
    this.tick++;
    const paused = s.mode === 'net' && !S.connected;
    if (!paused && !s.over) {
      s.fx = s.fx.filter(f => (f.t += dt) < 0.7);
      if (s.ph === 'ready' || s.ph === 'boom') {
        s.phT -= dt;
        if (s.phT <= 0) {
          if (s.ph === 'boom') this.resetRound();
          else s.ph = 'play';
        }
      }
      if (s.ph === 'play') this.physics(dt);
    }
    if (s.mode === 'net' && this.tick % 2 === 0) this.snapshot();
  },
  physics(dt){
    const s = this.st;
    if (s.mode === 'local') this.bot(dt);
    for (let k = 0; k < 2; k++) {
      const t = s.tanks[k], inp = s.inp[k];
      t.cd = Math.max(0, t.cd - dt);
      if (!t.alive) continue;
      if (inp.d >= 0) this.moveTank(k, inp.d, dt);
      if (inp.f > inp.lf) { inp.lf = inp.f; this.fire(k); }
    }
    const steps = Math.max(1, Math.ceil(TK_BULLET * dt / 0.1)), stepLen = TK_BULLET * dt / steps;
    for (const b of s.bullets) {
      for (let n = 0; n < steps && !b.dead; n++) {
        b.x += TK_DX[b.d] * stepLen; b.y += TK_DY[b.d] * stepLen;
        const ch = this.cell(b.x, b.y);
        if (ch === '#') { b.dead = true; break; }
        if (ch === 'b' || ch === 's') {
          if (ch === 'b') {
            const i = Math.floor(b.y) * TK_N + Math.floor(b.x);
            s.map = s.map.slice(0, i) + '.' + s.map.slice(i + 1);
          }
          s.fx.push({ x: b.x, y: b.y, t: 0, big: 0 });
          b.dead = true; break;
        }
        const j = 1 - b.o, t = s.tanks[j];
        if (t.alive && Math.abs(t.x - b.x) < TK_HALF + 0.08 && Math.abs(t.y - b.y) < TK_HALF + 0.08) {
          b.dead = true; t.alive = false;
          s.sc[b.o]++;
          s.fx.push({ x: t.x, y: t.y, t: 0, big: 1 });
          s.ph = 'boom'; s.phT = 1.4;
          if (s.sc[b.o] >= s.target) { s.over = { w: b.o }; this.finishSoon(); }
          if (j === this.meIdx()) NET.vibrate(250);
          break;
        }
      }
    }
    for (const a of s.bullets) for (const c of s.bullets)               // кулі збиваються одна об одну
      if (a !== c && !a.dead && !c.dead && a.o !== c.o && Math.abs(a.x - c.x) < 0.35 && Math.abs(a.y - c.y) < 0.35) {
        a.dead = c.dead = true; s.fx.push({ x: a.x, y: a.y, t: 0, big: 0 });
      }
    s.bullets = s.bullets.filter(b => !b.dead);
  },
  resetRound(){
    const s = this.st;
    s.tanks = this.spawn(); s.bullets = []; s.map = TK_MAP; s.ph = 'ready'; s.phT = 1.0;
    for (const inp of s.inp) inp.lf = inp.f;
  },
  bot(dt){
    const s = this.st, me = s.tanks[1], p = s.tanks[0], inp = s.inp[1];
    if (!me.alive || !p.alive) return;
    this.botT -= dt;
    if (this.botT > 0) return;
    this.botT = 0.28;
    const dx = p.x - me.x, dy = p.y - me.y;
    let want = -1;
    if (Math.abs(dx) < 0.45) want = dy < 0 ? 0 : 2;
    else if (Math.abs(dy) < 0.45) want = dx > 0 ? 1 : 3;
    if (want >= 0) {
      if (me.d === want && Math.random() < 0.55) inp.f++;
      inp.d = want; this.botLast = { x: me.x, y: me.y }; return;
    }
    const stuck = this.botLast && Math.abs(me.x - this.botLast.x) + Math.abs(me.y - this.botLast.y) < 0.05 && inp.d >= 0;
    if (stuck) { inp.d = Math.floor(Math.random() * 4); this.botT = 0.7; if (Math.random() < 0.5) inp.f++; }
    else inp.d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    this.botLast = { x: me.x, y: me.y };
  },
  finishSoon(){ setTimeout(() => this.showResult(), 1300); },

  // ---------- Мережа ----------
  r2: v => Math.round(v * 100) / 100,
  snapshot(){
    const s = this.st;
    send({ t:'tk_s',
      T: s.tanks.map(t => [this.r2(t.x), this.r2(t.y), t.d, t.alive ? 1 : 0]),
      B: s.bullets.map(b => [this.r2(b.x), this.r2(b.y)]),
      F: s.fx.map(f => [this.r2(f.x), this.r2(f.y), this.r2(f.t), f.big]),
      m: s.map, sc: s.sc, ph: s.ph, ov: s.over ? s.over.w : -1, tg: s.target });
  },
  sendState(){ send({ t:'state', game:'tk', target: this.st.target, name: S.myName }); },
  peerBack(){ if (this.st) { this.st.inp[1].d = -1; this.resyncF = true; } },
  onState(m){
    if (!this.st) { this.st = this.fresh('net', m.target || 5); this.begin(); }
    else enterGame();
    this.sendInput();
    toast('Зв’язок відновлено');
  },
  onMsg(m){
    const s = this.st; if (!s) return;
    if (m.t === 'tk_in' && this.isSim()) {
      const inp = s.inp[1];
      inp.d = m.d;
      if (this.resyncF) { inp.f = inp.lf = m.f; this.resyncF = false; }
      else inp.f = m.f;
    } else if (m.t === 'tk_s' && !this.isSim()) {
      s.view = m; s.sc = m.sc; s.target = m.tg; s.ph = m.ph;
      if (m.ov >= 0 && !s.over) { s.over = { w: m.ov }; this.finishSoon(); }
      const t = m.T[1];
      if (s.lastAlive === 1 && t && !t[3]) NET.vibrate(250);
      s.lastAlive = t ? t[3] : 1;
    }
  },

  // ---------- Керування ----------
  setDir(d){
    if (d === this.myD) return;
    this.myD = d;
    this.applyInput();
  },
  shoot(){ this.myF++; this.applyInput(); NET.vibrate(15); },
  applyInput(){
    const s = this.st; if (!s) return;
    if (this.isSim()) { s.inp[0].d = this.myD; s.inp[0].f = this.myF; }
    else this.sendInput();
  },
  sendInput(){ if (!this.isSim()) send({ t:'tk_in', d: this.myD, f: this.myF }); },

  // ---------- Результат ----------
  showResult(){
    const s = this.st;
    if (!s || !s.over || S.modalKind) return;
    const win = s.over.w === this.meIdx(), me = this.meIdx();
    const opp = S.mode === 'local' ? 'Комп’ютер' : S.oppName;
    ask('result', win ? 'Перемога! 🏆' : (S.mode === 'local' ? 'Комп’ютер переміг' : `Переміг ${esc(opp)}`),
        `Рахунок ${s.sc[me]} : ${s.sc[1 - me]}`, [
      { label:'Ще раз', cls:'gold', fn: rematch },
      { label:'В меню', fn: toMenu }
    ]);
  },

  // ---------- Малювання ----------
  resize(){
    const c = $('tkCanvas'); if (!c) return;
    const w = Math.min(window.innerWidth * 0.96, window.innerHeight * 0.58);
    const dpr = window.devicePixelRatio || 1;
    c.style.width = c.style.height = w + 'px';
    c.width = c.height = Math.round(w * dpr);
  },
  render(){ this.renderBar(); },
  renderBar(){
    const s = this.st, el = $('tkBar'); if (!s || !el) return;
    const me = this.meIdx();
    const names = S.mode === 'local' ? ['Ти', 'Комп’ютер'] : (me === 0 ? [S.myName, S.oppName] : [S.oppName, S.myName]);
    const html = `<span class="tkp"><i style="background:${TK_COL[0]}"></i>${esc(names[0])}</span>` +
      `<b>${s.sc[0]} : ${s.sc[1]}</b><span class="tkp r">${esc(names[1])}<i style="background:${TK_COL[1]}"></i></span>` +
      `<small>до ${s.target}</small>`;
    if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; }
  },
  frameData(){
    const s = this.st;
    if (this.isSim()) return { T: s.tanks.map(t => [t.x, t.y, t.d, t.alive ? 1 : 0]), B: s.bullets.map(b => [b.x, b.y]),
                               F: s.fx.map(f => [f.x, f.y, f.t, f.big]), m: s.map, ph: s.ph };
    const v = s.view; if (!v) return null;
    if (!this.smooth || this.smooth.length !== v.T.length) this.smooth = v.T.map(t => t.slice());
    v.T.forEach((t, k) => {                                // плавно підтягуємо танки до отриманих позицій
      const sm = this.smooth[k];
      if (Math.abs(sm[0] - t[0]) + Math.abs(sm[1] - t[1]) > 2) { sm[0] = t[0]; sm[1] = t[1]; }
      sm[0] += (t[0] - sm[0]) * 0.35; sm[1] += (t[1] - sm[1]) * 0.35; sm[2] = t[2]; sm[3] = t[3];
    });
    return { T: this.smooth, B: v.B, F: v.F, m: v.m, ph: v.ph };
  },
  draw(){
    const s = this.st, c = $('tkCanvas'); if (!s || !c) return;
    this.renderBar();
    const ctx = c.getContext && c.getContext('2d'); if (!ctx) return;
    const W = c.width, cs = W / TK_N, d = this.frameData();
    ctx.fillStyle = '#3b4a3e'; ctx.fillRect(0, 0, W, W);
    if (!d) return;
    for (let r = 0; r < TK_N; r++) for (let q = 0; q < TK_N; q++) {
      const ch = d.m[r * TK_N + q], x = q * cs, y = r * cs;
      if (ch === 'b') {
        ctx.fillStyle = '#b8572f'; ctx.fillRect(x, y, cs, cs);
        ctx.strokeStyle = '#7d3519'; ctx.lineWidth = Math.max(1, cs * 0.06);
        ctx.beginPath();
        ctx.moveTo(x, y + cs / 2); ctx.lineTo(x + cs, y + cs / 2);
        ctx.moveTo(x + cs / 2, y); ctx.lineTo(x + cs / 2, y + cs / 2);
        ctx.moveTo(x + cs / 4, y + cs / 2); ctx.lineTo(x + cs / 4, y + cs);
        ctx.moveTo(x + cs * 3 / 4, y + cs / 2); ctx.lineTo(x + cs * 3 / 4, y + cs);
        ctx.stroke();
      } else if (ch === 's') {
        ctx.fillStyle = '#8f9ca3'; ctx.fillRect(x, y, cs, cs);
        ctx.fillStyle = '#c3cdd2'; ctx.fillRect(x + cs * .2, y + cs * .2, cs * .6, cs * .6);
      } else if (ch === 'w') {
        ctx.fillStyle = '#2f6fa3'; ctx.fillRect(x, y, cs, cs);
        ctx.strokeStyle = '#7fb4dc'; ctx.lineWidth = Math.max(1, cs * 0.05);
        ctx.beginPath();
        for (const yy of [.35, .7]) { ctx.moveTo(x + cs * .15, y + cs * yy); ctx.quadraticCurveTo(x + cs * .5, y + cs * (yy - .12), x + cs * .85, y + cs * yy); }
        ctx.stroke();
      }
    }
    d.T.forEach((t, k) => { if (t[3]) this.drawTank(ctx, t[0] * cs, t[1] * cs, t[2], cs, TK_COL[k], k === this.meIdx()); });
    ctx.fillStyle = '#fff3c4';
    for (const b of d.B) { ctx.beginPath(); ctx.arc(b[0] * cs, b[1] * cs, cs * 0.11, 0, Math.PI * 2); ctx.fill(); }
    for (const f of d.F) {
      const k = Math.min(1, f[2] / 0.7), rad = cs * (f[3] ? 0.3 + k * 0.9 : 0.15 + k * 0.35);
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = '#ff9f43'; ctx.beginPath(); ctx.arc(f[0] * cs, f[1] * cs, rad, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(f[0] * cs, f[1] * cs, rad * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    let msg = '';
    if (s.over) msg = s.over.w === this.meIdx() ? 'Перемога!' : 'Поразка';
    else if (S.mode === 'net' && !S.connected) msg = 'Немає зв’язку';
    else if (d.ph === 'ready') msg = 'Приготуйся!';
    else if (d.ph === 'boom') msg = 'Влучання!';
    if (msg) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, W / 2 - cs * .9, W, cs * 1.8);
      ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(cs * .9)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(msg, W / 2, W / 2);
    }
  },
  drawTank(ctx, x, y, d, cs, col, mine){
    const s = cs * 0.84;
    ctx.save(); ctx.translate(x, y); ctx.rotate(d * Math.PI / 2);
    ctx.fillStyle = '#262626';
    ctx.fillRect(-s / 2, -s / 2, s * 0.26, s); ctx.fillRect(s / 2 - s * 0.26, -s / 2, s * 0.26, s);
    ctx.fillStyle = col; ctx.fillRect(-s * 0.3, -s * 0.38, s * 0.6, s * 0.76);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, s * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#262626'; ctx.fillRect(-s * 0.06, -s * 0.62, s * 0.12, s * 0.5);
    ctx.restore();
    if (mine) {
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = Math.max(1, cs * 0.05);
      ctx.beginPath(); ctx.arc(x, y, cs * 0.56, 0, Math.PI * 2); ctx.stroke();
    }
  }
};

// Хрестовина: працює як джойстик — можна вести пальцем, не відриваючи
(function(){
  const pad = $('tkPad'), knob = $('tkKnob');
  let pid = null;
  const upd = e => {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const lim = r.width * 0.32, len = Math.hypot(dx, dy) || 1, k = Math.min(1, lim / len);
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    if (len < r.width * 0.12) { TK.setDir(-1); return; }
    TK.setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  };
  const end = e => {
    if (e.pointerId !== pid) return;
    pid = null; knob.style.transform = ''; TK.setDir(-1);
  };
  pad.addEventListener('pointerdown', e => { pid = e.pointerId; try { pad.setPointerCapture(pid); } catch(x) {} upd(e); e.preventDefault(); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) upd(e); });
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
  $('tkFire').addEventListener('pointerdown', e => { e.preventDefault(); TK.shoot(); });
  $('tkMenu').onclick = () => confirmLeave();
  window.addEventListener('resize', () => { if (TK.st) TK.resize(); });
})();

// =================== БРОДИЛКА ВДВОХ ===================
// Командна гра: двоє героїв разом проходять лабіринти. Головний телефон рахує правила,
// другий надсилає свої кнопки й малює отриманий стан.
const MZ_COL = ['#f2c14e', '#5aa9e6'];
const MZ = {
  st: null, loop: null, raf: null, tick: 0, myD: -1, active2: 0, smooth: null, lastSent: '',
  active(){ return !!this.st; },
  stop(){ clearInterval(this.loop); this.loop = null; cancelAnimationFrame(this.raf); this.raf = null; this.st = null; this.smooth = null; this.myD = -1; },
  leaveFree(){ return !this.st || this.st.over; },
  isSim(){ return S.mode === 'local' || S.role === 'host'; },
  meIdx(){ return S.mode === 'local' ? this.active2 : (S.role === 'client' ? 1 : 0); },
  saved(){ try { return +localStorage.getItem('mz_level') || 0; } catch(e) { return 0; } },
  save(n){ try { if (n > this.saved()) localStorage.setItem('mz_level', n); } catch(e) {} },

  load(idx){
    const L = MZ_LEVELS[idx], W = L.m[0].length, H = L.m.length;
    let g = L.m.join(''), P = [];
    for (const [k, ch] of [[0, 'A'], [1, 'B']]) {
      const i = g.indexOf(ch);
      P[k] = { x: i % W, y: (i / W) | 0, d: 2, cd: 0 };
      g = g.slice(0, i) + '.' + g.slice(i + 1);
    }
    const coins = (g.match(/o/g) || []).length;
    return { L: idx, W, H, g, base: g, P, keys: 0, coins: 0, coinsTotal: coins, ph: 'play', phT: 0, inp: [-1, -1], over: false };
  },
  fresh(mode, idx){ const s = this.load(idx); s.mode = mode; return s; },

  // ---------- Старт ----------
  startLocal(){ this.stop(); this.active2 = 0; this.st = this.fresh('local', Math.min(this.saved(), MZ_LEVELS.length - 1)); this.begin(); },
  hostStart(opt){
    this.stop();
    const idx = opt === '1' ? 0 : Math.min(this.saved(), MZ_LEVELS.length - 1);
    this.st = this.fresh('net', idx);
    send({ t:'start', game:'mz', name: S.myName });
    this.begin();
  },
  clientStart(){ this.stop(); this.st = this.fresh('net', 0); this.st.view = null; this.begin(); },
  begin(){
    this.myD = -1; this.smooth = null; this.lastSent = '';
    enterGame(); this.resize();
    if (this.isSim()) { this.tick = 0; this.loop = setInterval(() => this.step(1 / 30), 33); }
    const frame = () => { this.draw(); this.raf = requestAnimationFrame(frame); };
    this.raf = requestAnimationFrame(frame);
  },
  newRound(){
    const mode = this.st ? this.st.mode : S.mode;
    this.stop(); this.st = this.fresh(mode, 0); closeModal(); S.rematchAsked = false; this.begin();
  },
  restart(){
    if (!this.st) return;
    if (!this.isSim()) { send({ t:'mz_rs' }); return; }
    const s = this.st, n = this.load(s.L);
    Object.assign(s, { g: n.g, P: n.P, keys: 0, coins: 0, ph: 'play', inp: [-1, -1] });
    this.smooth = null; toast('Рівень спочатку');
  },

  // ---------- Правила ----------
  cell(s, x, y){ return x < 0 || y < 0 || x >= s.W || y >= s.H ? '#' : s.g[y * s.W + x]; },
  pressed(s, plate){
    const gate = plate === '1' ? 'a' : 'b';
    return s.P.some(p => this.cell(s, p.x, p.y) === plate || s.base[p.y * s.W + p.x] === plate);
  },
  gateOpen(s, x, y){
    const ch = this.cell(s, x, y);
    if (ch !== 'a' && ch !== 'b') return true;
    if (s.P.some(p => p.x === x && p.y === y)) return true;
    return this.pressed(s, ch === 'a' ? '1' : '2');
  },
  tryMove(k, d){
    const s = this.st, p = s.P[k], o = s.P[1 - k];
    const nx = p.x + [0, 1, 0, -1][d], ny = p.y + [-1, 0, 1, 0][d];
    p.d = d;
    if (o.x === nx && o.y === ny) return false;
    const ch = this.cell(s, nx, ny);
    if (ch === '#') return false;
    if (ch === 'y' && k !== 0) { if (k === this.meIdx()) this.bump('Сюди може лише жовтий герой'); return false; }
    if (ch === 'z' && k !== 1) { if (k === this.meIdx()) this.bump('Сюди може лише синій герой'); return false; }
    if ((ch === 'a' || ch === 'b') && !this.gateOpen(s, nx, ny)) { if (k === this.meIdx()) this.bump('Ґрати зачинені. Потрібно стати на кнопку'); return false; }
    const i = ny * s.W + nx;
    if (ch === 'D') {
      if (s.keys <= 0) { if (k === this.meIdx()) this.bump('Двері зачинені. Знайдіть ключ 🔑'); return false; }
      s.keys--; s.g = s.g.slice(0, i) + '.' + s.g.slice(i + 1); s.base = s.base.slice(0, i) + '.' + s.base.slice(i + 1);
      NET.vibrate(60);
    }
    if (ch === 'k') { s.keys++; s.g = s.g.slice(0, i) + '.' + s.g.slice(i + 1); NET.vibrate(40); }
    if (ch === 'o') { s.coins++; s.g = s.g.slice(0, i) + '.' + s.g.slice(i + 1); NET.vibrate(20); }
    p.x = nx; p.y = ny;
    return true;
  },
  bump(msg){ const n = Date.now(); if (n - (this.lastBump || 0) > 1500) { this.lastBump = n; toast(msg); } },
  step(dt){
    const s = this.st; if (!s) return;
    this.tick++;
    const paused = s.mode === 'net' && !S.connected;
    if (!paused && !s.over) {
      if (s.ph === 'win') {
        s.phT -= dt;
        if (s.phT <= 0) {
          if (s.L + 1 >= MZ_LEVELS.length) { s.over = true; this.save(MZ_LEVELS.length - 1); setTimeout(() => this.showResult(), 300); }
          else { const n = this.load(s.L + 1); Object.assign(s, n, { mode: s.mode }); this.smooth = null; this.save(s.L); }
        }
      } else {
        for (let k = 0; k < 2; k++) {
          const p = s.P[k];
          p.cd = Math.max(0, p.cd - dt);
          if (s.inp[k] >= 0 && p.cd <= 0) { this.tryMove(k, s.inp[k]); p.cd = 0.17; }
        }
        const onE = s.P.filter(p => s.base[p.y * s.W + p.x] === 'E').length;
        if (onE === 2) { s.ph = 'win'; s.phT = 2.2; NET.vibrate(200); }
      }
    }
    if (s.mode === 'net' && this.tick % 3 === 0) this.snapshot();
  },

  // ---------- Мережа ----------
  snapshot(){
    const s = this.st;
    send({ t:'mz_s', L: s.L, g: s.g, b: s.base, P: s.P.map(p => [p.x, p.y, p.d]), k: s.keys, c: s.coins, ct: s.coinsTotal, ph: s.ph, ov: s.over ? 1 : 0 });
  },
  sendState(){ send({ t:'state', game:'mz', name: S.myName }); },
  peerBack(){ if (this.st) this.st.inp[1] = -1; },
  onState(){
    if (!this.st) { this.st = this.fresh('net', 0); this.begin(); } else enterGame();
    this.sendInput(); toast('Зв’язок відновлено');
  },
  onMsg(m){
    const s = this.st; if (!s) return;
    if (m.t === 'mz_in' && this.isSim()) s.inp[1] = m.d;
    else if (m.t === 'mz_rs' && this.isSim()) this.restart();
    else if (m.t === 'mz_s' && !this.isSim()) {
      if (m.L !== s.L) this.smooth = null;
      const L = MZ_LEVELS[m.L];
      Object.assign(s, { L: m.L, W: L.m[0].length, H: L.m.length, g: m.g, base: m.b, keys: m.k, coins: m.c, coinsTotal: m.ct, ph: m.ph });
      s.P = m.P.map(p => ({ x: p[0], y: p[1], d: p[2] }));
      if (m.ov && !s.over) { s.over = true; this.save(MZ_LEVELS.length - 1); setTimeout(() => this.showResult(), 300); }
      else this.save(m.L);
    }
  },

  // ---------- Керування ----------
  setDir(d){
    if (d === this.myD) return;
    this.myD = d;
    if (this.isSim()) { const k = this.meIdx(); this.st.inp[k] = d; if (S.mode === 'local') this.st.inp[1 - k] = -1; if (d >= 0 && this.st.P[k].cd <= 0.05) this.st.P[k].cd = 0; }
    else this.sendInput();
  },
  sendInput(){ if (!this.isSim()) send({ t:'mz_in', d: this.myD }); },
  swap(){
    if (S.mode !== 'local' || !this.st) return;
    this.st.inp[this.active2] = -1; this.active2 = 1 - this.active2; this.myD = -1;
    toast(this.active2 ? 'Тепер ходить синій герой' : 'Тепер ходить жовтий герой');
  },
  showResult(){
    if (S.modalKind) return;
    ask('result', 'Усі лабіринти пройдено! 🏆', `Ви разом пройшли ${MZ_LEVELS.length} рівнів. Справжня команда!`, [
      { label:'Пройти знову', cls:'gold', fn: rematch }, { label:'В меню', fn: toMenu }]);
  },

  // ---------- Малювання ----------
  resize(){
    const c = $('mzCanvas'); if (!c || !this.st) return;
    const s = this.st, maxW = window.innerWidth * 0.96, maxH = window.innerHeight * 0.56;
    const cs = Math.floor(Math.min(maxW / s.W, maxH / s.H));
    const dpr = window.devicePixelRatio || 1;
    c.style.width = cs * s.W + 'px'; c.style.height = cs * s.H + 'px';
    c.width = Math.round(cs * s.W * dpr); c.height = Math.round(cs * s.H * dpr);
    this.dims = s.W + 'x' + s.H;
  },
  render(){ this.renderBar(); },
  renderBar(){
    const s = this.st, el = $('mzBar'); if (!s || !el) return;
    const L = MZ_LEVELS[s.L];
    const who = S.mode === 'local' ? `<button class="chip" data-mz="swap"><i style="background:${MZ_COL[this.active2]}"></i>Герой ⇄</button>` :
      `<span class="chip"><i style="background:${MZ_COL[this.meIdx()]}"></i>Ти</span>`;
    const html = `<div class="mzrow"><b>${s.L + 1}. ${esc(L.n)}</b><span>🔑 ${s.keys}</span><span>⭐ ${s.coins}/${s.coinsTotal}</span></div>` +
      `<div class="mzrow"><small>${esc(L.hint)}</small></div>` +
      `<div class="mzrow">${who}<button class="chip" data-mz="restart">🔄 Заново</button><button class="chip" data-mz="menu">☰ Меню</button></div>`;
    if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; }
  },
  draw(){
    const s = this.st, c = $('mzCanvas'); if (!s || !c) return;
    if (this.dims !== s.W + 'x' + s.H) this.resize();
    this.renderBar();
    const ctx = c.getContext && c.getContext('2d'); if (!ctx) return;
    const cs = c.width / s.W;
    ctx.fillStyle = '#3b2f25'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const emoji = (t, x, y, k) => { ctx.font = `${Math.round(cs * (k || .7))}px sans-serif`; ctx.fillText(t, x * cs + cs / 2, y * cs + cs / 2 + cs * .04); };
    for (let y = 0; y < s.H; y++) for (let x = 0; x < s.W; x++) {
      const ch = s.g[y * s.W + x], base = s.base[y * s.W + x], X = x * cs, Y = y * cs;
      if (ch === '#') {
        ctx.fillStyle = '#6b5240'; ctx.fillRect(X, Y, cs, cs);
        ctx.fillStyle = '#7d6250'; ctx.fillRect(X, Y, cs, cs * .25);
        continue;
      }
      ctx.fillStyle = base === 'y' ? '#f7dd8a' : base === 'z' ? '#a9d4f3' : '#eadfc6';
      ctx.fillRect(X, Y, cs, cs);
      ctx.strokeStyle = 'rgba(0,0,0,.06)'; ctx.strokeRect(X + .5, Y + .5, cs - 1, cs - 1);
      if (base === 'E') { ctx.fillStyle = '#9fd8a6'; ctx.fillRect(X, Y, cs, cs); emoji('🏁', x, y); }
      if (base === '1' || base === '2') {
        const on = this.pressed(s, base);
        ctx.fillStyle = base === '1' ? '#d9534f' : '#8e5bd6';
        ctx.beginPath(); ctx.arc(X + cs / 2, Y + cs / 2 + (on ? cs * .04 : 0), cs * (on ? .3 : .34), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(X + cs / 2, Y + cs * .44, cs * .14, 0, Math.PI * 2); ctx.fill();
      }
      if (ch === 'a' || ch === 'b') {
        const open = this.gateOpen(s, x, y);
        ctx.strokeStyle = ch === 'a' ? '#d9534f' : '#8e5bd6'; ctx.lineWidth = cs * .1;
        ctx.globalAlpha = open ? .25 : 1;
        ctx.beginPath();
        for (const f of [.2, .5, .8]) { ctx.moveTo(X + cs * f, Y + cs * .08); ctx.lineTo(X + cs * f, Y + cs * .92); }
        ctx.moveTo(X + cs * .08, Y + cs * .5); ctx.lineTo(X + cs * .92, Y + cs * .5);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
      if (ch === 'D') { ctx.fillStyle = '#9a6a3a'; ctx.fillRect(X + cs * .1, Y + cs * .05, cs * .8, cs * .9); emoji('🔒', x, y, .5); }
      if (ch === 'k') emoji('🔑', x, y);
      if (ch === 'o') emoji('⭐', x, y, .6);
    }
    // герої (плавно)
    if (!this.smooth) this.smooth = s.P.map(p => ({ x: p.x, y: p.y }));
    s.P.forEach((p, k) => {
      const sm = this.smooth[k];
      sm.x += (p.x - sm.x) * .35; sm.y += (p.y - sm.y) * .35;
      const X = sm.x * cs + cs / 2, Y = sm.y * cs + cs / 2, r = cs * .38;
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(X, Y + r * .8, r * .8, r * .3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = MZ_COL[k]; ctx.beginPath(); ctx.arc(X, Y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2a1d08'; ctx.lineWidth = Math.max(1.5, cs * .05); ctx.stroke();
      const ex = [0, 1, 0, -1][p.d] * r * .25, ey = [-1, 0, 1, 0][p.d] * r * .25;
      ctx.fillStyle = '#fff';
      for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(X + sx * r * .35 + ex, Y - r * .1 + ey, r * .22, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#1b1b1b';
      for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(X + sx * r * .35 + ex * 1.4, Y - r * .1 + ey * 1.4, r * .1, 0, Math.PI * 2); ctx.fill(); }
      if (k === this.meIdx()) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = Math.max(1, cs * .04); ctx.beginPath(); ctx.arc(X, Y, r * 1.25, 0, Math.PI * 2); ctx.stroke(); }
    });
    let msg = '';
    if (s.ph === 'win' && !s.over) msg = s.L + 1 >= MZ_LEVELS.length ? 'Скарб знайдено! 🏆' : 'Рівень пройдено! 🎉';
    else if (S.mode === 'net' && !S.connected) msg = 'Немає зв’язку';
    if (msg) {
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, c.height / 2 - cs * .8, c.width, cs * 1.6);
      ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(cs * .7)}px system-ui, sans-serif`;
      ctx.fillText(msg, c.width / 2, c.height / 2);
    }
  }
};

// =================== ГОНКИ ===================
// Вид згори, 3 кола. Машинка їде сама, гравець лише кермує (◀ ▶) і за потреби гальмує.
// Хто з'їхав на траву — сповільнюється; жовті стрілки на трасі дають прискорення.
const RC_W = 100, RC_H = 130, RC_TRACK = 15, RC_LAPS = 3;
const RC_TRACKS = {
  1: { n:'Овал', pts:[[22,18],[78,18],[90,35],[90,95],[78,112],[22,112],[10,95],[10,35]] },
  2: { n:'Квасоля', pts:[[20,15],[80,15],[92,35],[86,58],[62,64],[62,72],[86,80],[92,103],[80,118],[20,118],[8,98],[8,35]] },
  3: { n:'Змійка', pts:[[16,12],[84,12],[92,30],[92,104],[84,120],[62,120],[52,104],[42,90],[24,86],[12,70],[24,55],[42,50],[46,32]] }
};
const RC_COL = ['#f2c14e', '#5aa9e6'];

// Згладжена траса: сплайн Катмулла-Рома по контрольних точках
function rcBuild(id){
  const P = RC_TRACKS[id].pts, n = P.length, out = [];
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    for (let k = 0; k < 24; k++) {
      const t = k / 24, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  const N = out.length, cps = [];
  for (let i = 0; i < N; i += Math.floor(N / 16)) cps.push(i);
  const boosts = [Math.floor(N * 0.3), Math.floor(N * 0.72)];
  // декор: дерева й кущі там, де немає траси
  let seed = id * 9301 + 49297; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const deco = [];
  for (let t = 0; t < 200 && deco.length < 22; t++) {
    const x = 4 + rnd() * 92, y = 4 + rnd() * 122;
    if (rcDist(out, x, y).d > RC_TRACK * 0.9) deco.push([x, y, rnd() < .6 ? '🌳' : rnd() < .5 ? '🌲' : '🌼']);
  }
  return { pts: out, N, cps, boosts, deco };
}
function rcDist(pts, x, y){
  let best = 1e9, bi = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1;
    let t = ((x - a[0]) * dx + (y - a[1]) * dy) / L; t = Math.max(0, Math.min(1, t));
    const px = a[0] + dx * t, py = a[1] + dy * t, d = (x - px) ** 2 + (y - py) ** 2;
    if (d < best) { best = d; bi = i; }
  }
  return { d: Math.sqrt(best), i: bi };
}

const RC = {
  st: null, tr: null, loop: null, raf: null, tick: 0, my: { s: 0, b: 0 }, smooth: null,
  active(){ return !!this.st; },
  stop(){ clearInterval(this.loop); this.loop = null; cancelAnimationFrame(this.raf); this.raf = null; this.st = null; this.smooth = null; this.my = { s: 0, b: 0 }; },
  leaveFree(){ return !this.st || !!this.st.win || this.st.ph === 'count'; },
  isSim(){ return S.mode === 'local' || S.role === 'host'; },
  meIdx(){ return S.mode === 'net' && S.role === 'client' ? 1 : 0; },

  fresh(mode, track){
    const tr = this.tr = rcBuild(track);
    const i0 = 3, a = tr.pts[i0], b = tr.pts[i0 + 1];
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), nx = -Math.sin(ang), ny = Math.cos(ang);
    const car = s => ({ x: a[0] + nx * s * RC_TRACK * .22, y: a[1] + ny * s * RC_TRACK * .22, a: ang, v: 0, lap: 0, cp: 1, boost: 0, fin: 0 });
    return { mode, track, cars: [car(-1), car(1)], inp: [{ s: 0, b: 0 }, { s: 0, b: 0 }], ph: 'count', cd: 3.5, win: null, t: 0 };
  },
  startLocal(){ this.stop(); this.st = this.fresh('local', 1 + Math.floor(Math.random() * 3)); this.begin(); },
  hostStart(track){
    this.stop(); this.st = this.fresh('net', RC_TRACKS[track] ? track : 1);
    send({ t:'start', game:'rc', track: this.st.track, name: S.myName });
    this.begin();
  },
  clientStart(m){ this.stop(); this.st = this.fresh('net', m.track || 1); this.st.view = null; this.begin(); },
  begin(){
    this.smooth = null; this.my = { s: 0, b: 0 };
    enterGame(); this.resize();
    if (this.isSim()) { this.tick = 0; this.loop = setInterval(() => this.step(1 / 30), 33); }
    const frame = () => { this.draw(); this.raf = requestAnimationFrame(frame); };
    this.raf = requestAnimationFrame(frame);
  },
  newRound(){
    const tr = this.st ? this.st.track : 1, mode = this.st ? this.st.mode : S.mode;
    this.stop(); this.st = this.fresh(mode, mode === 'local' ? 1 + Math.floor(Math.random() * 3) : tr);
    closeModal(); S.rematchAsked = false; this.begin();
  },

  // ---------- Фізика ----------
  step(dt){
    const s = this.st; if (!s) return;
    this.tick++;
    const paused = s.mode === 'net' && !S.connected;
    if (!paused && !s.win) {
      if (s.ph === 'count') { s.cd -= dt; if (s.cd <= 0.5) s.ph = 'race'; }
      if (s.ph === 'race') { s.t += dt; if (s.mode === 'local') this.bot(); for (let k = 0; k < 2; k++) this.drive(k, dt); this.collide(); }
    }
    if (s.mode === 'net' && this.tick % 2 === 0) this.snapshot();
  },
  drive(k, dt){
    const s = this.st, c = s.cars[k], inp = s.inp[k], tr = this.tr;
    if (c.fin) { c.v = Math.max(0, c.v - 30 * dt); }
    const near = rcDist(tr.pts, c.x, c.y);
    const off = near.d > RC_TRACK / 2;
    c.boost = Math.max(0, c.boost - dt);
    for (const bi of tr.boosts) { const p = tr.pts[bi]; if (Math.hypot(p[0] - c.x, p[1] - c.y) < 5) c.boost = 1.4; }
    let vmax = off ? 13 : 30;
    if (c.boost > 0 && !off) vmax = 42;
    if (k === 1 && s.mode === 'local') vmax *= 0.9;
    if (!c.fin) {
      if (inp.b) c.v -= 45 * dt;
      else if (c.v < vmax) c.v += (c.boost > 0 ? 40 : 20) * dt;
      if (c.v > vmax) c.v -= 55 * dt;
    }
    c.v = Math.max(0, c.v);
    c.a += inp.s * 2.7 * dt * Math.min(1, c.v / 12 + 0.25);
    c.x = Math.max(2, Math.min(RC_W - 2, c.x + Math.cos(c.a) * c.v * dt));
    c.y = Math.max(2, Math.min(RC_H - 2, c.y + Math.sin(c.a) * c.v * dt));
    // контрольні точки по черзі; повне коло — коли повернувся на старт
    const cpi = tr.cps[c.cp];
    const cp = tr.pts[cpi];
    if (Math.hypot(cp[0] - c.x, cp[1] - c.y) < RC_TRACK * 0.85) {
      if (c.cp === 0) {
        c.lap++;
        if (c.lap >= RC_LAPS && !c.fin) {
          c.fin = s.t;
          if (!s.win) { s.win = { w: k }; setTimeout(() => this.showResult(), 1500); }
        }
      }
      c.cp = (c.cp + 1) % tr.cps.length;
    }
  },
  collide(){
    const [a, b] = this.st.cars, dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < 3.6 && d > 0.01) {
      const push = (3.6 - d) / 2, ux = dx / d, uy = dy / d;
      a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push;
      a.v *= 0.92; b.v *= 0.92;
    }
  },
  bot(){
    const s = this.st, c = s.cars[1], tr = this.tr, inp = s.inp[1];
    const near = rcDist(tr.pts, c.x, c.y);
    const tgt = tr.pts[(near.i + 9) % tr.N];
    let want = Math.atan2(tgt[1] - c.y, tgt[0] - c.x) - c.a;
    while (want > Math.PI) want -= 2 * Math.PI;
    while (want < -Math.PI) want += 2 * Math.PI;
    inp.s = want > 0.08 ? 1 : want < -0.08 ? -1 : 0;
    inp.b = Math.abs(want) > 1.1 && c.v > 18 ? 1 : 0;
  },
  progress(c){
    const tr = this.tr, prev = tr.cps[(c.cp - 1 + tr.cps.length) % tr.cps.length];
    return c.lap * 1000 + ((c.cp - 1 + tr.cps.length) % tr.cps.length) * 10 + (c.cp === 0 ? 9 : 0) + (prev ? 0 : 0);
  },

  // ---------- Мережа ----------
  r1: v => Math.round(v * 10) / 10,
  snapshot(){
    const s = this.st;
    send({ t:'rc_s', C: s.cars.map(c => [this.r1(c.x), this.r1(c.y), Math.round(c.a * 100) / 100, c.lap, c.cp, c.boost > 0 ? 1 : 0, c.fin ? 1 : 0]),
           ph: s.ph, cd: this.r1(s.cd), w: s.win ? s.win.w : -1, tr: s.track });
  },
  sendState(){ send({ t:'state', game:'rc', track: this.st.track, name: S.myName }); },
  peerBack(){ if (this.st) this.st.inp[1] = { s: 0, b: 0 }; },
  onState(m){
    if (!this.st) { this.st = this.fresh('net', m.track || 1); this.begin(); } else enterGame();
    this.sendInput(); toast('Зв’язок відновлено');
  },
  onMsg(m){
    const s = this.st; if (!s) return;
    if (m.t === 'rc_in' && this.isSim()) s.inp[1] = { s: m.s, b: m.b };
    else if (m.t === 'rc_s' && !this.isSim()) {
      if (m.tr !== s.track) { s.track = m.tr; this.tr = rcBuild(m.tr); }
      s.view = m; s.ph = m.ph; s.cd = m.cd;
      m.C.forEach((c, k) => Object.assign(s.cars[k], { lap: c[3], cp: c[4], fin: c[6] }));
      if (m.w >= 0 && !s.win) { s.win = { w: m.w }; setTimeout(() => this.showResult(), 1500); }
    }
  },

  // ---------- Керування ----------
  setInput(sv, bv){
    if (sv !== undefined) this.my.s = sv;
    if (bv !== undefined) this.my.b = bv;
    if (!this.st) return;
    if (this.isSim()) this.st.inp[0] = { s: this.my.s, b: this.my.b };
    else this.sendInput();
  },
  sendInput(){ if (!this.isSim()) send({ t:'rc_in', s: this.my.s, b: this.my.b }); },
  showResult(){
    const s = this.st; if (!s || !s.win || S.modalKind) return;
    const win = s.win.w === this.meIdx();
    const opp = S.mode === 'local' ? 'Комп’ютер' : S.oppName;
    ask('result', win ? 'Перемога! 🏆' : `Першим фінішував ${esc(opp)}`,
        `Траса «${RC_TRACKS[s.track].n}», ${RC_LAPS} кола. Час: ${Math.round(s.t || 0)} с`, [
      { label:'Ще гонка', cls:'gold', fn: rematch }, { label:'В меню', fn: toMenu }]);
  },

  // ---------- Малювання ----------
  resize(){
    const c = $('rcCanvas'); if (!c) return;
    const h = Math.min(window.innerHeight * 0.6, window.innerWidth * 0.96 * RC_H / RC_W), w = h * RC_W / RC_H;
    const dpr = window.devicePixelRatio || 1;
    c.style.width = w + 'px'; c.style.height = h + 'px';
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  },
  render(){ this.renderBar(); },
  renderBar(){
    const s = this.st, el = $('rcBar'); if (!s || !el) return;
    const me = this.meIdx(), cars = s.cars;
    const names = S.mode === 'local' ? ['Ти', 'Комп’ютер'] : (me === 0 ? [S.myName, S.oppName] : [S.oppName, S.myName]);
    const lap = c => Math.min(RC_LAPS, c.lap + 1);
    const html = cars.map((c, k) => `<span class="tkp ${k ? 'r' : ''}"><i style="background:${RC_COL[k]}"></i>${esc(names[k])} · ${c.fin ? '🏁' : 'коло ' + lap(c) + '/' + RC_LAPS}</span>`).join('<b>VS</b>');
    if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; }
  },
  carsNow(){
    const s = this.st;
    if (this.isSim()) return s.cars.map(c => [c.x, c.y, c.a, c.boost > 0 ? 1 : 0]);
    const v = s.view; if (!v) return null;
    if (!this.smooth) this.smooth = v.C.map(c => c.slice());
    v.C.forEach((c, k) => {
      const sm = this.smooth[k];
      if (Math.hypot(sm[0] - c[0], sm[1] - c[1]) > 15) { sm[0] = c[0]; sm[1] = c[1]; sm[2] = c[2]; }
      sm[0] += (c[0] - sm[0]) * .35; sm[1] += (c[1] - sm[1]) * .35;
      let da = c[2] - sm[2]; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
      sm[2] += da * .4; sm[5] = c[5];
    });
    return this.smooth.map(c => [c[0], c[1], c[2], c[5]]);
  },
  draw(){
    const s = this.st, c = $('rcCanvas'); if (!s || !c) return;
    this.renderBar();
    const ctx = c.getContext && c.getContext('2d'); if (!ctx) return;
    const k = c.width / RC_W, tr = this.tr;
    ctx.fillStyle = '#4f8a3c'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(k * 6)}px sans-serif`;
    for (const d of tr.deco) ctx.fillText(d[2], d[0] * k, d[1] * k);
    const path = () => { ctx.beginPath(); tr.pts.forEach((p, i) => i ? ctx.lineTo(p[0] * k, p[1] * k) : ctx.moveTo(p[0] * k, p[1] * k)); ctx.closePath(); };
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    path(); ctx.strokeStyle = '#e9e2d0'; ctx.lineWidth = (RC_TRACK + 2) * k; ctx.stroke();
    path(); ctx.strokeStyle = '#d9534f'; ctx.setLineDash([3 * k, 3 * k]); ctx.lineWidth = (RC_TRACK + 2) * k; ctx.stroke(); ctx.setLineDash([]);
    path(); ctx.strokeStyle = '#5b6166'; ctx.lineWidth = RC_TRACK * k; ctx.stroke();
    path(); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.setLineDash([2.5 * k, 3.5 * k]); ctx.lineWidth = .5 * k; ctx.stroke(); ctx.setLineDash([]);
    // старт / фініш
    const p0 = tr.pts[tr.cps[0]], p1 = tr.pts[tr.cps[0] + 1];
    const ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
    ctx.save(); ctx.translate(p0[0] * k, p0[1] * k); ctx.rotate(ang);
    const sq = RC_TRACK / 6;
    for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) {
      ctx.fillStyle = (i + j) % 2 ? '#111' : '#fff';
      ctx.fillRect((j - 1) * sq * k, (-RC_TRACK / 2 + i * sq) * k, sq * k, sq * k);
    }
    ctx.restore();
    // прискорювачі
    for (const bi of tr.boosts) {
      const a = tr.pts[bi], b = tr.pts[(bi + 1) % tr.N], an = Math.atan2(b[1] - a[1], b[0] - a[0]);
      ctx.save(); ctx.translate(a[0] * k, a[1] * k); ctx.rotate(an);
      ctx.fillStyle = '#ffd34d';
      for (const off of [-2.5, 1]) { ctx.beginPath(); ctx.moveTo((off) * k, -3 * k); ctx.lineTo((off + 3) * k, 0); ctx.lineTo(off * k, 3 * k); ctx.lineTo((off + 1.2) * k, 0); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    const cars = this.carsNow();
    if (cars) cars.forEach((cr, i) => this.drawCar(ctx, cr[0] * k, cr[1] * k, cr[2], k, RC_COL[i], i === this.meIdx(), cr[3]));
    let msg = '';
    const cd = s.cd;
    if (s.win) msg = s.win.w === this.meIdx() ? 'Перемога! 🏆' : 'Фініш!';
    else if (S.mode === 'net' && !S.connected) msg = 'Немає зв’язку';
    else if (s.ph === 'count') msg = cd > 2.5 ? '3' : cd > 1.5 ? '2' : cd > 0.5 ? '1' : 'Старт!';
    if (msg) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, c.height / 2 - 9 * k, c.width, 18 * k);
      ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(11 * k)}px system-ui, sans-serif`;
      ctx.fillText(msg, c.width / 2, c.height / 2);
    }
  },
  drawCar(ctx, x, y, a, k, col, mine, boost){
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    if (boost) { ctx.fillStyle = 'rgba(255,170,40,.8)'; ctx.beginPath(); ctx.moveTo(-2.6 * k, -.8 * k); ctx.lineTo(-5 * k, 0); ctx.lineTo(-2.6 * k, .8 * k); ctx.fill(); }
    ctx.fillStyle = '#1e1e1e';
    for (const [dx, dy] of [[-1.3, -1.25], [1.3, -1.25], [-1.3, 1.25], [1.3, 1.25]]) ctx.fillRect((dx - .55) * k, (dy - .3) * k, 1.1 * k, .6 * k);
    ctx.fillStyle = col; ctx.fillRect(-2.2 * k, -1.1 * k, 4.4 * k, 2.2 * k);
    ctx.fillStyle = '#bfe3f7'; ctx.fillRect(.5 * k, -.8 * k, 1 * k, 1.6 * k);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-1.6 * k, -.8 * k, 1.6 * k, 1.6 * k);
    ctx.restore();
    if (mine) { ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = .4 * k; ctx.beginPath(); ctx.arc(x, y, 3.6 * k, 0, Math.PI * 2); ctx.stroke(); }
  }
};

// Керування гонками: утримання кнопок
(function(){
  const hold = (id, on, off) => {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(x) {} b.classList.add('on'); on(); });
    const up = () => { b.classList.remove('on'); off(); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  };
  hold('rcL', () => RC.setInput(-1), () => { if (RC.my.s === -1) RC.setInput(0); });
  hold('rcR', () => RC.setInput(1), () => { if (RC.my.s === 1) RC.setInput(0); });
  hold('rcB', () => RC.setInput(undefined, 1), () => RC.setInput(undefined, 0));
  $('rcMenu').onclick = () => confirmLeave();
  window.addEventListener('resize', () => { if (RC.st) RC.resize(); if (MZ.st) MZ.resize(); });
  // Бродилка: джойстик як у танчиках
  const pad = $('mzPad'), knob = $('mzKnob'); let pid = null;
  const upd = e => {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const lim = r.width * 0.32, len = Math.hypot(dx, dy) || 1, k = Math.min(1, lim / len);
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    if (len < r.width * 0.12) { MZ.setDir(-1); return; }
    MZ.setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  };
  const end = e => { if (e.pointerId !== pid) return; pid = null; knob.style.transform = ''; MZ.setDir(-1); };
  pad.addEventListener('pointerdown', e => { pid = e.pointerId; try { pad.setPointerCapture(pid); } catch(x) {} upd(e); e.preventDefault(); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) upd(e); });
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  $('mzBar').addEventListener('click', e => {
    const b = e.target.closest('[data-mz]'); if (!b) return;
    if (b.dataset.mz === 'swap') MZ.swap();
    else if (b.dataset.mz === 'restart') MZ.restart();
    else if (b.dataset.mz === 'menu') confirmLeave();
  });
})();

// ---------- Кнопка «Назад» на телефоні ----------
function onBack(){
  if (S.modalKind) { if (S.modalKind === 'promo') { S.selected = null; render(); } closeModal(); return; }
  if (inGame()) return confirmLeave();
  if (S.screen === 'host' || S.screen === 'join') return toMenu();
  if (S.screen === 'pick') return show('menu');
  if (S.screen === 'enquest') { if (EQ.view === 'album') { EQ.view = 'map'; return EQ.render(); } return toMenu(); }
  if (S.screen === 'engame' && EN.st && EN.st.mode === 'quest') { const b = document.querySelector('#enBody [data-a="menu"]'); if (b) b.click(); return; }
  NET.exit();
}
