<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ігри вдвох</title>
<style>
:root{
  --felt:#1e3b2f; --felt-2:#26493a; --felt-3:#2f5a47;
  --light:#efd8ab; --dark:#a8703f; --brass:#e6b450; --ink:#f4ecdc; --muted:#a9bfb2;
  --red:#d9534f; --sel:rgba(246,226,90,.72); --last:rgba(230,180,80,.42);
  --piece-font:"Noto Sans Symbols 2","Noto Sans Symbols","DejaVu Sans","Segoe UI Symbol",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--felt);color:var(--ink);
  font-family:system-ui,-apple-system,"Roboto",sans-serif;font-size:16px;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit;user-select:text;-webkit-user-select:text}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:20px 18px;overflow-y:auto}
.screen.on{display:flex}

/* ----- Меню ----- */
#menu{justify-content:center;gap:14px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.hero .knight{font-family:var(--piece-font);font-size:84px;line-height:1;color:var(--light);
  -webkit-text-stroke:1.5px #3b2716;text-shadow:0 4px 0 #13271e}
.hero h1{font-family:"Noto Serif",Georgia,serif;font-size:52px;margin:0;letter-spacing:.5px;color:var(--light)}
.field{width:100%;max-width:340px}
.field label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px 4px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--felt-3);
  background:var(--felt-2);color:var(--ink);font-size:18px;outline:none}
.field input:focus{border-color:var(--brass)}
.big{width:100%;max-width:340px;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;
  background:var(--felt-2);text-align:left;border:2px solid var(--felt-3);transition:transform .08s}
.big:active{transform:scale(.98)}
.big .ic{font-size:28px;width:34px;text-align:center}
.big b{display:block;font-size:18px}
.big small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.big.primary{background:var(--brass);color:#2a1d08;border-color:var(--brass)}
.big.primary small{color:#5b4316}
.note{max-width:340px;color:var(--muted);font-size:13px;text-align:center;line-height:1.45;margin-top:6px}

/* ----- Очікування / пошук ----- */
.panel{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;margin-top:8px}
.panel h2{margin:0 0 4px;font-size:24px}
.seg{display:flex;background:var(--felt-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 4px;border-radius:9px;background:transparent;font-size:15px}
.seg button.on{background:var(--brass);color:#2a1d08;font-weight:600}
.wait{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;background:var(--felt-2)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--felt-3);border-top-color:var(--brass);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ip{font-size:14px;color:var(--muted);line-height:1.5}
.ip b{color:var(--ink);font-size:17px}
.found{display:flex;flex-direction:column;gap:10px;min-height:64px}
.found button{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;background:var(--brass);color:#2a1d08;text-align:left;font-size:18px;font-weight:600}
.found button small{font-weight:400;font-size:13px;margin-left:auto;opacity:.75}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;padding:12px;border-radius:12px;border:2px solid var(--felt-3);background:var(--felt-2);color:var(--ink);outline:none}
.btn{padding:12px 16px;border-radius:12px;background:var(--felt-3);font-weight:600}
.btn.gold{background:var(--brass);color:#2a1d08}
.btn.ghost{background:transparent;border:2px solid var(--felt-3)}
details{color:var(--muted);font-size:14px}
details summary{padding:6px 2px}
.hint{display:none;padding:12px 14px;border-radius:12px;background:#3a2f1a;color:#f3dfb2;font-size:14px;line-height:1.45}
.hint.on{display:block}

/* ----- Гра ----- */
#game{padding:10px 8px;justify-content:flex-start;gap:8px}
.player{width:var(--bw);display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--felt-2);min-height:46px;border:2px solid transparent}
.player.turn{border-color:var(--brass)}
.player .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #000}
.player .dot.w{background:#fff}.player .dot.b{background:#222;border-color:#888}
.player .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.player .cap{margin-left:auto;font-family:var(--piece-font);font-size:18px;letter-spacing:-3px;white-space:nowrap;overflow:hidden;color:var(--muted)}
.player .adv{font-size:13px;color:var(--brass);margin-left:6px;letter-spacing:0}
:root{--bw:min(96vw,58vh)}
#board{width:var(--bw);height:var(--bw);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border-radius:6px;overflow:hidden;box-shadow:0 0 0 4px #3b2716,0 10px 24px rgba(0,0,0,.35);touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--sel)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(230,40,30,.95) 0%,rgba(230,40,30,.55) 45%,rgba(230,40,30,0) 75%)}
.pc{position:relative;font-family:var(--piece-font);font-size:calc(var(--bw) / 8 * .8);line-height:1;pointer-events:none}
.pc.w{color:#fffaf0;-webkit-text-stroke:1.4px #2a1a0c;text-shadow:0 2px 1px rgba(0,0,0,.25)}
.pc.b{color:#1d1712;-webkit-text-stroke:.6px #000;text-shadow:0 0 2px rgba(255,240,210,.5)}
.dotm{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(30,59,47,.45)}
.ring{position:absolute;inset:4%;border-radius:50%;border:calc(var(--bw) / 8 * .08) solid rgba(30,59,47,.5)}
.co{position:absolute;font-size:10px;font-weight:700;line-height:1;pointer-events:none}
.co.r{top:3px;left:3px}.co.f{bottom:2px;right:4px}
.sq.l .co{color:var(--dark)}.sq.d .co{color:var(--light)}
#status{width:var(--bw);text-align:center;font-size:17px;font-weight:600;min-height:24px}
#status.alert{color:#ffb4a8}
#moves{width:var(--bw);display:flex;gap:10px;overflow-x:auto;white-space:nowrap;font-size:14px;color:var(--muted);padding:2px 2px 4px;min-height:22px;scrollbar-width:none}
#moves span b{color:var(--ink);font-weight:500}
#moves .pf{font-family:var(--piece-font)}
.actions{width:var(--bw);display:flex;gap:6px}
.actions button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--felt-2);font-size:12px;color:var(--muted)}
.actions button span{font-size:20px;color:var(--ink)}
.actions button:disabled{opacity:.35}
.actions button.gold{background:var(--brass);color:#2a1d08}.actions button.gold span{color:#2a1d08}
#banner{width:var(--bw);display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#3a2f1a;color:#f3dfb2;font-size:14px}
#banner.on{display:flex}
#banner .btn{margin-left:auto;padding:8px 12px;font-size:14px}

/* ----- Вікна ----- */
#modal{position:fixed;inset:0;background:rgba(10,20,15,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.on{display:flex}
.card{width:100%;max-width:340px;background:var(--felt-2);border:2px solid var(--felt-3);border-radius:18px;padding:22px 20px;text-align:center;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.card h3{margin:0 0 8px;font-size:24px}
.card p{margin:0 0 18px;color:var(--muted);line-height:1.45}
.card .btns{display:flex;flex-direction:column;gap:10px}
.card .btns .btn{padding:14px;font-size:17px}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.promo button{aspect-ratio:1;border-radius:12px;background:var(--light);display:flex;align-items:center;justify-content:center}
.promo .pc{font-size:44px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:#0f1f18;color:var(--ink);
  padding:11px 16px;border-radius:12px;font-size:15px;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.gamesel{width:100%;max-width:340px}
.bannerSlot{display:contents}
/* Морський бій */
#bsgame{padding:10px 8px;justify-content:flex-start}
.bsbody{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.gw-big{--gw:min(94vw,47vh)}
.gw-mid{--gw:min(94vw,56vh)}
.gw-small{--gw:min(56vw,22vh)}
.bshead{width:var(--gw);display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600}
.bshead small{font-weight:400;color:var(--muted);font-size:13px}
.bsgrid{width:var(--gw);display:grid;grid-template-columns:repeat(11,1fr);gap:2px}
.bsgrid .lb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:calc(var(--gw) / 11 * .4);color:var(--muted)}
.bsgrid .c{aspect-ratio:1;border-radius:3px;background:#cfe5ee;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--gw) / 11 * .62);font-weight:900;line-height:1}
.bsgrid.turn{outline:3px solid var(--brass);outline-offset:3px;border-radius:4px}
.c.ship{background:#456a80}
.c.ship.sel{background:var(--brass)}
.c.miss::after,.c.halo::after{content:"";width:24%;height:24%;border-radius:50%;background:#4a7186}
.c.halo::after{opacity:.4}
.c.hit{background:#f2b6a9;color:#c0392b}
.c.hit::after{content:"✕"}
.c.ship.hit{background:#e0533d;color:#fff}
.c.sunk{background:#7a281c;color:#f4c4b8}
.c.sunk::after{content:"✕"}
.c.reveal{background:#456a80;opacity:.75}
.c.pend{background:var(--brass);animation:pl .5s infinite alternate}
@keyframes pl{to{opacity:.4}}
#bsStatus{font-size:17px;font-weight:600;text-align:center;min-height:24px}
#bsStatus.good{color:#ffd77a}#bsStatus.bad{color:#ffb4a8}
.bsnote{font-size:14px;color:var(--muted);text-align:center;min-height:18px;margin-top:-4px}
.tray{width:var(--gw);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tray button{padding:8px 10px;border-radius:10px;background:var(--felt-2);display:flex;align-items:center;gap:7px;font-size:14px;border:2px solid var(--felt-3)}
.tray button.on{background:var(--brass);color:#2a1d08;border-color:var(--brass)}
.tray button:disabled{opacity:.3}
.blk{display:inline-flex;gap:2px}.blk i{display:block;width:9px;height:14px;border-radius:2px;background:currentColor}
.bsgame-actions{width:var(--gw)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- МЕНЮ -->
<section id="menu" class="screen on">
  <div class="hero"><span class="knight" id="heroIc">♞</span><h1 id="heroTitle">Шахи</h1></div>
  <div class="seg gamesel" id="gameSeg">
    <button data-g="chess" class="on">♞ Шахи</button>
    <button data-g="bs">⚓ Морський бій</button>
  </div>
  <div class="field">
    <label for="name">Як тебе звати?</label>
    <input id="name" maxlength="16" autocomplete="off" placeholder="Ім'я">
  </div>
  <button class="big primary" id="bNear"><span class="ic">🤝</span><span><b>Грати з другом поруч</b><small>Через Bluetooth, без Wi-Fi та інтернету</small></span></button>
  <button class="big" id="bWifi"><span class="ic">📶</span><span><b>Грати по Wi-Fi</b><small>Обидва телефони в одній мережі</small></span></button>
  <button class="big" id="bLocal"><span class="ic" id="localIc">📱</span><span><b id="localTitle">Грати вдвох на цьому телефоні</b><small id="localSub">Передавайте телефон по черзі</small></span></button>
</section>

<!-- ВИБІР: СТВОРИТИ ЧИ ПРИЄДНАТИСЯ -->
<section id="pick" class="screen">
  <div class="panel">
    <h2 id="pickTitle">Гра з другом поруч</h2>
    <p class="ip" id="pickNote" style="margin:0"></p>
    <button class="big primary" id="bHost"><span class="ic">♔</span><span><b>Створити гру</b><small>Друг приєднається до тебе</small></span></button>
    <button class="big" id="bJoin"><span class="ic">🔍</span><span><b>Приєднатися до гри</b><small>Знайти гру на телефоні друга</small></span></button>
    <button class="btn ghost" id="pickBack">Назад</button>
  </div>
</section>

<!-- СТВОРЕННЯ ГРИ -->
<section id="host" class="screen">
  <div class="panel">
    <h2>Нова гра</h2>
    <div>
      <div class="ip" style="margin:0 0 6px 4px" id="segLabel">Я граю за</div>
      <div class="seg" id="colorSeg">
        <button data-c="w" class="on">⚪ Білих</button>
        <button data-c="b">⚫ Чорних</button>
        <button data-c="r">🎲 Навмання</button>
      </div>
    </div>
    <div class="wait"><div class="spin"></div><div>Чекаю на суперника…<br><span class="ip">Попроси його натиснути «Приєднатися до гри»</span></div></div>
    <div class="ip" id="hostIpBox">Адреса цього телефона: <b id="hostIp">—</b><br>Знадобиться, якщо інший телефон не знайде гру сам.</div>
    <div class="ip" id="hostNearBox">Тримайте телефони поруч, на відстані кількох метрів.</div>
    <button class="btn ghost" id="hostCancel">Скасувати</button>
  </div>
</section>

<!-- ПРИЄДНАННЯ -->
<section id="join" class="screen">
  <div class="panel">
    <h2>Пошук ігор</h2>
    <div class="wait"><div class="spin"></div><div id="joinState">Шукаю ігри…</div></div>
    <div class="found" id="found"></div>
    <div class="hint" id="joinHint"></div>
    <details id="manualBox">
      <summary>Ввести адресу вручну</summary>
      <div class="row" style="margin-top:8px">
        <input id="manualIp" inputmode="decimal" placeholder="192.168.1.23">
        <button class="btn gold" id="manualGo">Підключитися</button>
      </div>
    </details>
    <button class="btn ghost" id="joinCancel">Скасувати</button>
  </div>
</section>

<!-- ГРА -->
<section id="game" class="screen">
  <div class="player" id="pTop"></div>
  <div id="board"></div>
  <div class="player" id="pBot"></div>
  <div id="status"></div>
  <div class="bannerSlot"><div id="banner"><span id="bannerText"></span></div></div>
  <div id="moves"></div>
  <div class="actions" id="actions"></div>
</section>

<!-- МОРСЬКИЙ БІЙ -->
<section id="bsgame" class="screen">
  <div class="bannerSlot"></div>
  <div id="bsBody" class="bsbody"></div>
</section>

<div id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>

<script>
// ---------- Шаховий рушій: правила, легальні ходи, кінець партії ----------
const FILES = 'abcdefgh';
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const sqName = i => FILES[i & 7] + (8 - (i >> 3));
const sqIdx = n => (8 - parseInt(n[1], 10)) * 8 + FILES.indexOf(n[0]);
const colorOf = p => (p === p.toUpperCase() ? 'w' : 'b');
const DIRS = {
  N: [[-2, -1], [-2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2], [2, -1], [2, 1]],
  B: [[-1, -1], [-1, 1], [1, -1], [1, 1]],
  R: [[-1, 0], [1, 0], [0, -1], [0, 1]],
};
DIRS.Q = DIRS.B.concat(DIRS.R);
DIRS.K = DIRS.Q;

class Chess {
  constructor(fen) { this.load(fen || START_FEN); }

  load(fen) {
    let [pos, turn, cas, ep, half, full] = fen.trim().split(/\s+/);
    this.b = new Array(64).fill(null);
    let i = 0;
    for (const ch of pos) {
      if (ch === '/') continue;
      if (/\d/.test(ch)) i += +ch; else this.b[i++] = ch;
    }
    this.turn = turn || 'w';
    cas = cas || '-';
    this.cas = { K: cas.includes('K'), Q: cas.includes('Q'), k: cas.includes('k'), q: cas.includes('q') };
    this.ep = !ep || ep === '-' ? -1 : sqIdx(ep);
    this.half = +half || 0;
    this.full = +full || 1;
    this.hist = []; this.uci = []; this.san = []; this.keys = [];
    this.rep = {};
    const k = this.key(); this.rep[k] = 1; this.keys.push(k);
  }

  key() {
    const c = this.cas;
    const epPart = this.ep >= 0 && this.pseudo(this.turn).some(m => m.ep) ? this.ep : '';
    return this.b.map(p => p || '.').join('') + this.turn +
      (c.K ? 'K' : '') + (c.Q ? 'Q' : '') + (c.k ? 'k' : '') + (c.q ? 'q' : '') + epPart;
  }

  attacked(sq, by) {
    const b = this.b, r = sq >> 3, f = sq & 7;
    const pr = by === 'w' ? r + 1 : r - 1;
    const P = by === 'w' ? 'P' : 'p', N = by === 'w' ? 'N' : 'n', K = by === 'w' ? 'K' : 'k';
    const Bs = by === 'w' ? 'BQ' : 'bq', Rs = by === 'w' ? 'RQ' : 'rq';
    for (const df of [-1, 1]) {
      const f2 = f + df;
      if (pr >= 0 && pr < 8 && f2 >= 0 && f2 < 8 && b[pr * 8 + f2] === P) return true;
    }
    for (const [dr, df] of DIRS.N) {
      const r2 = r + dr, f2 = f + df;
      if (r2 >= 0 && r2 < 8 && f2 >= 0 && f2 < 8 && b[r2 * 8 + f2] === N) return true;
    }
    for (const [dr, df] of DIRS.K) {
      const r2 = r + dr, f2 = f + df;
      if (r2 >= 0 && r2 < 8 && f2 >= 0 && f2 < 8 && b[r2 * 8 + f2] === K) return true;
    }
    for (const [dirs, set] of [[DIRS.B, Bs], [DIRS.R, Rs]]) {
      for (const [dr, df] of dirs) {
        let r2 = r + dr, f2 = f + df;
        while (r2 >= 0 && r2 < 8 && f2 >= 0 && f2 < 8) {
          const p = b[r2 * 8 + f2];
          if (p) { if (set.includes(p)) return true; break; }
          r2 += dr; f2 += df;
        }
      }
    }
    return false;
  }

  kingSq(side) { return this.b.indexOf(side === 'w' ? 'K' : 'k'); }
  inCheck(side) { side = side || this.turn; const k = this.kingSq(side); return k >= 0 && this.attacked(k, side === 'w' ? 'b' : 'w'); }

  pseudo(side) {
    const res = [], b = this.b;
    const addPawn = (i, j, promo) => {
      if (promo) for (const p of ['q', 'r', 'b', 'n']) res.push({ from: i, to: j, promo: p });
      else res.push({ from: i, to: j });
    };
    for (let i = 0; i < 64; i++) {
      const p = b[i];
      if (!p || colorOf(p) !== side) continue;
      const r = i >> 3, f = i & 7, t = p.toUpperCase();
      if (t === 'P') {
        const dir = side === 'w' ? -1 : 1, start = side === 'w' ? 6 : 1, last = side === 'w' ? 0 : 7;
        const r1 = r + dir;
        if (r1 < 0 || r1 > 7) continue;
        const j = r1 * 8 + f;
        if (!b[j]) {
          addPawn(i, j, r1 === last);
          const j2 = (r + 2 * dir) * 8 + f;
          if (r === start && !b[j2]) res.push({ from: i, to: j2, dbl: true });
        }
        for (const df of [-1, 1]) {
          const f2 = f + df;
          if (f2 < 0 || f2 > 7) continue;
          const jc = r1 * 8 + f2;
          if (b[jc] && colorOf(b[jc]) !== side) addPawn(i, jc, r1 === last);
          else if (jc === this.ep && !b[jc]) res.push({ from: i, to: jc, ep: true });
        }
      } else if (t === 'N' || t === 'K') {
        for (const [dr, df] of DIRS[t]) {
          const r2 = r + dr, f2 = f + df;
          if (r2 < 0 || r2 > 7 || f2 < 0 || f2 > 7) continue;
          const j = r2 * 8 + f2;
          if (!b[j] || colorOf(b[j]) !== side) res.push({ from: i, to: j });
        }
      } else {
        for (const [dr, df] of DIRS[t]) {
          let r2 = r + dr, f2 = f + df;
          while (r2 >= 0 && r2 < 8 && f2 >= 0 && f2 < 8) {
            const j = r2 * 8 + f2;
            if (!b[j]) res.push({ from: i, to: j });
            else { if (colorOf(b[j]) !== side) res.push({ from: i, to: j }); break; }
            r2 += dr; f2 += df;
          }
        }
      }
    }
    return res;
  }

  legal() {
    const side = this.turn, opp = side === 'w' ? 'b' : 'w', b = this.b;
    const moves = this.pseudo(side);
    const k = side === 'w' ? 60 : 4, K = side === 'w' ? 'K' : 'k', R = side === 'w' ? 'R' : 'r';
    if (b[k] === K && !this.attacked(k, opp)) {
      if (this.cas[side === 'w' ? 'K' : 'k'] && b[k + 3] === R && !b[k + 1] && !b[k + 2] &&
          !this.attacked(k + 1, opp) && !this.attacked(k + 2, opp))
        moves.push({ from: k, to: k + 2, castle: [k + 3, k + 1] });
      if (this.cas[side === 'w' ? 'Q' : 'q'] && b[k - 4] === R && !b[k - 1] && !b[k - 2] && !b[k - 3] &&
          !this.attacked(k - 1, opp) && !this.attacked(k - 2, opp))
        moves.push({ from: k, to: k - 2, castle: [k - 4, k - 1] });
    }
    return moves.filter(m => {
      this.apply(m);
      const ok = !this.inCheck(side);
      this.undo();
      return ok;
    });
  }

  apply(m) {
    const b = this.b, side = this.turn, p = b[m.from];
    const capSq = m.ep ? m.to + (side === 'w' ? 8 : -8) : m.to;
    const cap = b[capSq];
    this.hist.push({ m, p, cap, cas: { ...this.cas }, ep: this.ep, half: this.half, full: this.full });
    if (m.ep) b[capSq] = null;
    b[m.to] = m.promo ? (side === 'w' ? m.promo.toUpperCase() : m.promo) : p;
    b[m.from] = null;
    if (m.castle) { const [rf, rt] = m.castle; b[rt] = b[rf]; b[rf] = null; }
    if (p === 'K') this.cas.K = this.cas.Q = false;
    if (p === 'k') this.cas.k = this.cas.q = false;
    for (const sq of [m.from, m.to]) {
      if (sq === 63) this.cas.K = false;
      if (sq === 56) this.cas.Q = false;
      if (sq === 7) this.cas.k = false;
      if (sq === 0) this.cas.q = false;
    }
    this.ep = m.dbl ? (m.from + m.to) / 2 : -1;
    this.half = p.toUpperCase() === 'P' || cap ? 0 : this.half + 1;
    if (side === 'b') this.full++;
    this.turn = side === 'w' ? 'b' : 'w';
  }

  undo() {
    const r = this.hist.pop();
    if (!r) return;
    const b = this.b, m = r.m;
    this.turn = this.turn === 'w' ? 'b' : 'w';
    b[m.from] = r.p;
    if (m.ep) { b[m.to] = null; b[m.to + (this.turn === 'w' ? 8 : -8)] = r.cap; }
    else b[m.to] = r.cap;
    if (m.castle) { const [rf, rt] = m.castle; b[rf] = b[rt]; b[rt] = null; }
    this.cas = r.cas; this.ep = r.ep; this.half = r.half; this.full = r.full;
  }

  uciOf(m) { return sqName(m.from) + sqName(m.to) + (m.promo || ''); }
  findUci(u, legal) { return (legal || this.legal()).find(m => this.uciOf(m) === u) || null; }

  sanOf(m, legal) {
    if (m.castle) return m.to > m.from ? 'O-O' : 'O-O-O';
    const p = this.b[m.from], t = p.toUpperCase();
    const capture = !!this.b[m.to] || !!m.ep;
    let s = '';
    if (t === 'P') {
      if (capture) s += FILES[m.from & 7] + 'x';
      s += sqName(m.to);
      if (m.promo) s += '=' + m.promo.toUpperCase();
    } else {
      s += t;
      const others = legal.filter(o => o.to === m.to && o.from !== m.from && this.b[o.from] === p);
      if (others.length) {
        const sameFile = others.some(o => (o.from & 7) === (m.from & 7));
        const sameRank = others.some(o => (o.from >> 3) === (m.from >> 3));
        if (!sameFile) s += FILES[m.from & 7];
        else if (!sameRank) s += 8 - (m.from >> 3);
        else s += sqName(m.from);
      }
      if (capture) s += 'x';
      s += sqName(m.to);
    }
    return s;
  }

  // Хід з записом історії (для гри, не для перебору)
  play(m) {
    const legal = this.legal();
    const real = legal.find(o => o.from === m.from && o.to === m.to && (o.promo || '') === (m.promo || ''));
    if (!real) return false;
    let s = this.sanOf(real, legal);
    const u = this.uciOf(real);
    this.apply(real);
    if (this.inCheck()) s += this.legal().length ? '+' : '#';
    this.uci.push(u); this.san.push(s);
    const k = this.key(); this.keys.push(k);
    this.rep[k] = (this.rep[k] || 0) + 1;
    return true;
  }
  playUci(u) { const m = this.findUci(u); return m ? this.play(m) : false; }

  unplay() {
    if (!this.uci.length) return false;
    const k = this.keys.pop();
    this.rep[k]--;
    this.undo();
    this.uci.pop(); this.san.pop();
    return true;
  }

  insufficient() {
    const pieces = [];
    for (let i = 0; i < 64; i++) {
      const p = this.b[i];
      if (p && p.toUpperCase() !== 'K') pieces.push({ t: p.toUpperCase(), sqc: ((i >> 3) + (i & 7)) % 2 });
    }
    if (!pieces.length) return true;
    if (pieces.length === 1 && (pieces[0].t === 'N' || pieces[0].t === 'B')) return true;
    if (pieces.every(x => x.t === 'B') && pieces.every(x => x.sqc === pieces[0].sqc)) return true;
    return false;
  }

  status() {
    const moves = this.legal(), chk = this.inCheck();
    if (!moves.length) return chk
      ? { over: true, result: this.turn === 'w' ? '0-1' : '1-0', reason: 'mate' }
      : { over: true, result: '1/2', reason: 'stalemate' };
    if (this.insufficient()) return { over: true, result: '1/2', reason: 'material' };
    if (this.rep[this.keys[this.keys.length - 1]] >= 3) return { over: true, result: '1/2', reason: 'repetition' };
    if (this.half >= 100) return { over: true, result: '1/2', reason: 'fifty' };
    return { over: false, check: chk };
  }
}

</script>
<script>

const S = {
  mode: null, role: null, myColor: 'w', myName: 'Гравець', oppName: 'Суперник',

// ---------- Екрани ----------
function show(id){

}

}

}
function closeModal(){ $('modal').classList.remove('on'); S.modalKind = null; }
function ask(kind, title, text, buttons){

    buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('') + '</div>';

// ---------- Ім'я ----------
try { S.myName = localStorage.getItem('shakhy_name') || ''; } catch(e) {}
$('name').value = S.myName;
function saveName(){

}

$('bLocal').onclick = () => {

};
function setGameType(g){
  S.gameType = g === 'bs' ? 'bs' : 'chess';
  try { localStorage.setItem('igry_game', S.gameType); } catch(e) {}
  const bs = S.gameType === 'bs';
  document.querySelectorAll('#gameSeg button').forEach(x => x.classList.toggle('on', x.dataset.g === S.gameType));
  $('heroIc').textContent = bs ? '⚓' : '♞';
  $('heroTitle').textContent = bs ? 'Морський бій' : 'Шахи';
  $('localIc').textContent = bs ? '🤖' : '📱';
  $('localTitle').textContent = bs ? 'Грати з комп’ютером' : 'Грати вдвох на цьому телефоні';
  $('localSub').textContent = bs ? 'Якщо друга немає поруч' : 'Передавайте телефон по черзі';
}
$('gameSeg').onclick = e => { const b = e.target.closest('button'); if (b) setGameType(b.dataset.g); };
try { setGameType(localStorage.getItem('igry_game') || 'chess'); } catch(e) {}
$('bNear').onclick = () => openPick('nearby');
$('bWifi').onclick = () => openPick('wifi');
$('pickBack').onclick = () => show('menu');
function openPick(t){
  saveName();
  S.transport = t;
  const gname = S.gameType === 'bs' ? 'Морський бій' : 'Шахи';

    : 'Обидва телефони мають бути в одній Wi-Fi мережі. Інтернет не потрібен.';
  show('pick');
}
// Перевірка перед грою поруч: сервіси Google, Bluetooth, геолокація
function nearbyReady(){
  if (S.transport !== 'nearby') return true;
  const c = NET.nearbyCheck();
  if (!c) return true;
  if (c === 'noplay') ask('np', 'Не працює на цьому телефоні', 'Для гри поруч потрібні сервіси Google Play, а їх тут немає. Спробуйте «Грати по Wi-Fi» або точку доступу.', [{ label:'Зрозуміло', cls:'gold' }]);
  else if (c === 'bt') ask('np', 'Увімкни Bluetooth', 'Без Bluetooth телефони не знайдуть один одного.', [
    { label:'Відкрити налаштування', cls:'gold', fn: () => NET.openSettings('bt') }, { label:'Скасувати' }]);
  else if (c === 'loc') ask('np', 'Увімкни геолокацію', 'На цьому телефоні Android шукає пристрої поруч тільки з увімкненою геолокацією.', [
    { label:'Відкрити налаштування', cls:'gold', fn: () => NET.openSettings('loc') }, { label:'Скасувати' }]);
  return false;
}
function onNearbyDenied(){
  show('pick');
  ask('perm', 'Потрібен дозвіл', 'Щоб знайти телефон друга поруч, Android просить дозвіл на пристрої поблизу (на старих телефонах — на геолокацію). Гра не стежить за місцем, це вимога Bluetooth-пошуку.', [
    { label:'Відкрити налаштування', cls:'gold', fn: () => NET.openSettings('app') }, { label:'Скасувати' }]);
}
function onNearbyFail(msg){
  if (S.screen === 'host' || S.screen === 'join') {
    NET.stopAll(); show('pick');
    ask('fail', 'Не вийшло', esc(msg), [{ label:'Зрозуміло', cls:'gold' }]);
  } else if (inGame()) {
    setBanner(msg, 'Ще раз', reconnect);
  }
}
$('bHost').onclick = () => {
  if (!nearbyReady()) return;
  Object.assign(S, { mode:'net', role:'host', connected:false, game:null, over:null });
  const near = S.transport === 'nearby';
  $('hostIpBox').style.display = near ? 'none' : '';
  $('hostNearBox').style.display = near ? '' : 'none';
  $('hostIp').textContent = near ? '' : (NET.myIps() || '—');
  const bs = S.gameType === 'bs';
  $('segLabel').textContent = bs ? 'Першим стріляє' : 'Я граю за';
  const lb = bs ? ['🙋 Я', '🧒 Друг', '🎲 Навмання'] : ['⚪ Білих', '⚫ Чорних', '🎲 Навмання'];
  document.querySelectorAll('#colorSeg button').forEach((x, k) => x.textContent = lb[k]);
  const label = S.myName + '|' + S.gameType;
  NET.setTransport(S.transport, label);
  show('host'); NET.host(label);
};
$('colorSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.hostChoice = b.dataset.c;
  document.querySelectorAll('#colorSeg button').forEach(x => x.classList.toggle('on', x === b));
};
$('hostCancel').onclick = toMenu;

let found = {}, hintTimer = null;
$('bJoin').onclick = () => {
  if (!nearbyReady()) return;
  Object.assign(S, { mode:'net', role:'client', connected:false, game:null, over:null, autoJoin:null });
  NET.setTransport(S.transport, S.myName);
  startSearch();
};
function startSearch(){
  found = {}; renderFound();
  const near = S.transport === 'nearby';
  $('joinState').textContent = near ? 'Шукаю ігри поруч…' : 'Шукаю ігри в цій мережі…';
  $('manualBox').style.display = near ? 'none' : '';
  $('joinHint').textContent = near
    ? 'Гри поки не видно. Перевір, що на телефоні друга відкрито «Створити гру», на обох увімкнено Bluetooth і телефони лежать поруч.'
    : 'Гри поки не видно. Перевір, що на іншому телефоні відкрито «Створити гру» і обидва телефони в одній Wi-Fi мережі. Гостьові мережі роутера часто не пускають телефони один до одного.';
  $('joinHint').classList.remove('on');
  clearTimeout(hintTimer); hintTimer = setTimeout(() => $('joinHint').classList.add('on'), 8000);
  show('join'); NET.startScan();
}
function renderFound(){
  const list = Object.values(found);
  $('found').innerHTML = list.map(h =>
    `<button data-ip="${esc(h.ip)}">${h.game === 'bs' ? '⚓' : '♞'} ${esc(h.name)}<small>${h.game === 'bs' ? 'морський бій' : 'шахи'}${S.transport === 'wifi' ? '<br>' + esc(h.ip) : ''}</small></button>`).join('');
  if (list.length) $('joinHint').classList.remove('on');
}
$('found').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const h = found[b.dataset.ip]; if (h) S.lastHostName = h.name + '|' + h.game;
  joinIp(b.dataset.ip);
};
$('manualGo').onclick = () => {
  const ip = $('manualIp').value.trim();
  if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { toast('Адреса має виглядати так: 192.168.1.23'); return; }
  joinIp(ip);
};
function joinIp(ip){
  NET.stopScan(); S.lastHostIp = ip;
  $('joinState').textContent = 'Підключаюсь…';
  NET.connect(ip);
}
$('joinCancel').onclick = toMenu;
setInterval(() => {
  if (S.transport !== 'wifi') return;
  const now = Date.now(); let ch = false;
  for (const k in found) if (now - found[k].seen > 4500) { delete found[k]; ch = true; }
  if (ch && S.screen === 'join') renderFound();
}, 1500);

let leaveToken = 0;
function toMenu(){
  if (S.mode === 'net' && S.connected) send({ t:'bye' });
  clearTimeout(hintTimer);
  NET.stopHosting(); NET.stopScan();
  const token = ++leaveToken;
  setTimeout(() => { if (token === leaveToken && S.mode === null) NET.disconnect(); }, 300);
  Object.assign(S, { mode:null, role:null, connected:false, game:null, over:null, selected:null });
  B = null; clearTimeout(aiTimer);
  closeModal(); $('banner').classList.remove('on');
  show('menu');
}

// ---------- Події з Android ----------
function onHosting(ips){ if (ips) $('hostIp').textContent = ips; }
function onHostFound(json){
  try {
    const o = JSON.parse(json);
    const fresh = !found[o.ip];
    const parts = String(o.name || '').split('|');
    found[o.ip] = { name: cleanName(parts[0]) || 'Гра', game: parts[1] === 'bs' ? 'bs' : 'chess', ip: o.ip, seen: Date.now() };
    if (S.autoJoin && found[o.ip].name + '|' + found[o.ip].game === S.autoJoin) {
      S.autoJoin = null; NET.stopScan(); setBanner('Підключаюсь…'); NET.connect(o.ip); return;
    }
    if (fresh && S.screen === 'join') renderFound();
  } catch(e) {}
}
function onHostLost(id){ if (found[id]) { delete found[id]; if (S.screen === 'join') renderFound(); } }
function onNetError(msg){ toast(msg); }
let lastFail = 0;
function onConnectFailed(){
  if (Date.now() - lastFail < 1500) return;
  lastFail = Date.now();
  if (S.screen === 'join') {
    toast('Не вдалося підключитися. Перевір мережу й спробуй ще.');
    startSearch();
  } else if (inGame()) {
    setBanner(S.transport === 'nearby' ? 'Не вдалося підключитися. Телефони поруч, Bluetooth увімкнено?'
                                       : 'Не вдалося підключитися. Обидва телефони в одній Wi-Fi мережі?', 'Ще раз', reconnect);
  }
}
function onConnected(addr){
  S.connected = true; S.lastRecv = Date.now();
  if (S.role === 'client') S.lastHostIp = addr;
  S.autoJoin = null;
  clearTimeout(hintTimer);
  $('banner').classList.remove('on');
  send({ t:'hello', name:S.myName, v:1 });
  if (inGame()) render();
}
function onDisconnected(){ lost(); }
function lost(){
  if (!S.connected) return;
  S.connected = false;
  if (inGame()) {
    if (S.role === 'host') setBanner('Суперник відключився. Чекаю, поки повернеться…');
    else setBanner('Зв\'язок з суперником втрачено.', 'Підключитися знову', reconnect);
    render();
  } else if (S.screen === 'join') {
    startSearch();
  }
}
function reconnect(){
  if (S.transport === 'nearby') {
    // Після обриву в друга буде нова «адреса», тому шукаємо його гру за іменем
    if (!S.lastHostName) return;
    S.autoJoin = S.lastHostName;
    setBanner('Шукаю гру друга поруч…', 'Скасувати', () => { S.autoJoin = null; NET.stopScan();
      setBanner('Зв\'язок з суперником втрачено.', 'Підключитися знову', reconnect); });
    NET.startScan();
    return;
  }
  if (!S.lastHostIp) return;
  setBanner('Підключаюсь…');
  NET.connect(S.lastHostIp);
}
function setBanner(text, btn, fn){
  const b = $('banner');
  b.innerHTML = `<span>${esc(text)}</span>` + (btn ? `<button class="btn gold">${esc(btn)}</button>` : '');
  if (btn) b.querySelector('button').onclick = fn;
  b.classList.add('on');
}

function send(o){ if (S.connected) NET.send(JSON.stringify(o)); }

// Перевірка зв'язку: якщо 12 секунд тиші — вважаємо, що зв'язок обірвався
setInterval(() => {
  if (S.mode !== 'net' || !S.connected) return;
  send({ t:'ping' });
  if (Date.now() - S.lastRecv > 12000) { NET.disconnect(); lost(); }
}, 3000);

function onMessage(line){
  S.lastRecv = Date.now();
  let m; try { m = JSON.parse(line); } catch(e) { return; }
  if (typeof m.t === 'string' && m.t.indexOf('bs_') === 0) { bsMsg(m); return; }
  switch (m.t) {
    case 'ping': send({ t:'pong' }); break;
    case 'hello':
      S.oppName = cleanName(m.name) || 'Суперник';
      if (S.role === 'host') {
        if (hasGame() && inGame()) { sendState(); toast(`${S.oppName} повернувся в гру`); render(); }
        else startNetGame();
      } else if (inGame()) render();
      break;
    case 'start':
      if (m.name) S.oppName = cleanName(m.name);
      S.gameType = m.game === 'bs' ? 'bs' : 'chess';
      if (S.gameType === 'bs') { bsNew(m.first, m.round); enterGame(); break; }
      S.myColor = m.hostColor === 'w' ? 'b' : 'w';
      newGame(); enterGame();
      break;
    case 'state': {
      if (m.game === 'bs') { if (m.name) S.oppName = cleanName(m.name); S.gameType = 'bs'; bsOnState(m); break; }
      S.gameType = 'chess';
      S.myColor = m.hostColor === 'w' ? 'b' : 'w';
      if (m.name) S.oppName = cleanName(m.name);
      const g = new Chess();
      for (const u of (m.moves || [])) if (!g.playUci(u)) break;
      const wasInGame = inGame() && S.game;
      S.game = g; S.legal = g.legal(); S.over = m.over || null; S.selected = null; S.rematchAsked = false;
      enterGame();
      if (wasInGame) toast('Зв\'язок відновлено');
      break;
    }
    case 'needState': if (S.role === 'host' && hasGame()) sendState(); break;
    case 'move': {
      const g = S.game;
      if (!g || S.over) return;
      if (m.n !== g.uci.length || g.turn === S.myColor) { resync(); return; }
      const mv = g.findUci(m.u, S.legal);
      if (!mv) { resync(); return; }
      doMove(mv, false);
      break;
    }
    case 'resign':
      if (S.gameType === 'bs') { if (B && !B.over) bsFinish(true, 'resign'); break; }
      if (!S.over) finish(S.myColor === 'w' ? '1-0' : '0-1', 'resign');
      break;
    case 'drawOffer':
      if (S.over) return;
      ask('draw', 'Нічия?', `${esc(S.oppName)} пропонує закінчити партію внічию.`, [
        { label:'Погодитись', cls:'gold', fn: () => { send({ t:'drawAccept' }); finish('1/2', 'agreement'); } },
        { label:'Грати далі', fn: () => send({ t:'drawDecline' }) }
      ]);
      break;
    case 'drawAccept': if (!S.over) finish('1/2', 'agreement'); break;
    case 'drawDecline': toast('Суперник хоче грати далі'); break;
    case 'undoReq':
      if (S.over || !S.game || m.n !== S.game.uci.length) return;
      ask('undo', 'Скасувати хід?', `${esc(S.oppName)} просить скасувати свій останній хід.`, [
        { label:'Дозволити', cls:'gold', fn: () => {
            if (S.game.uci.length !== m.n) return;
            send({ t:'undoOk', n:m.n }); undoOne(); } },
        { label:'Ні', fn: () => send({ t:'undoNo' }) }
      ]);
      break;
    case 'undoOk': if (S.game && S.game.uci.length === m.n) { undoOne(); toast('Хід скасовано'); } break;
    case 'undoNo': toast('Суперник не дозволив скасувати хід'); break;
    case 'rematch':
      if (S.rematchAsked) { newRound(); return; }
      ask('rematch', 'Ще партію?', `${esc(S.oppName)} хоче зіграти ще. ` + (S.gameType === 'bs' ? 'Першим стрілятиме інший гравець.' : 'Кольори поміняються.'), [
        { label:'Грати!', cls:'gold', fn: () => { send({ t:'rematchAccept' }); newRound(); } },
        { label:'Ні, дякую', fn: () => send({ t:'rematchNo' }) }
      ]);
      break;
    case 'rematchAccept': if (S.rematchAsked) newRound(); break;
    case 'rematchNo': S.rematchAsked = false; toast('Суперник не хоче грати ще'); render(); break;
    case 'bye':
      S.connected = false;
      NET.disconnect();
      ask('bye', 'Суперник вийшов', `${esc(S.oppName)} вийшов з гри.`, [{ label:'В меню', cls:'gold', fn: toMenu }]);
      break;
  }
}
function resync(){ if (S.role === 'host') sendState(); else send({ t:'needState' }); }
function sendState(){
  if (S.gameType === 'bs') { bsSendState(); return; }
  send({ t:'state', game:'chess', hostColor:S.myColor, moves:S.game.uci, over:S.over, name:S.myName });
}
function hasGame(){ return S.gameType === 'bs' ? !!B : !!S.game; }

function startNetGame(){

$('board').addEventListener('click', e => {

function askPromo(cands){

function doMove(m, mine){

function finish(result, reason){

function resultInfo(){

                             : (loser === 'w' ? 'Білі здали партію.' : 'Чорні здали партію.'),

    material: 'Ні в кого не лишилося фігур, щоб поставити мат.',

function showResult(){

// ---------- Кнопки під дошкою ----------
function act(id){
  const g = S.game;

    send({ t:'undoReq', n:g.uci.length }); return toast('Питаю суперника…');
  }
  if (id === 'draw') {

// ---------- Малювання ----------
function render(){ if (S.gameType === 'bs') bsRender(); else renderChess(); }
function renderChess(){

  }

  else {
    const canUndo = S.mode === 'local' ? g.uci.length > 0 : (S.connected && g.uci.length > 0 && g.turn !== S.myColor);
    a = [['undo', '↶', 'Скасувати', false, !canUndo], ['draw', '🤝', 'Нічия', false, S.mode === 'net' && !S.connected],
         ['resign', '🏳️', 'Здатися'], ['menu', '☰', 'Меню']];

function fig(s){ return s.replace(/^[KQRBN]/, c => `<span class="pf">${OUT[c]}</span>`); }
function capturedBy(g){
  const init = { p:8, n:2, b:2, r:2, q:1 };
  const left = { w:{ p:0, n:0, b:0, r:0, q:0 }, b:{ p:0, n:0, b:0, r:0, q:0 } };
  for (const p of g.b) if (p && p.toLowerCase() !== 'k') left[colorOf(p)][p.toLowerCase()]++;
  const res = { w:{ pieces:[], score:0 }, b:{ pieces:[], score:0 } };
  for (const victim of ['w', 'b']) {
    const taker = victim === 'w' ? 'b' : 'w';
    for (const t of ['q', 'r', 'b', 'n', 'p']) {
      const n = Math.max(0, init[t] - left[victim][t]);
      for (let k = 0; k < n; k++) res[taker].pieces.push(t);
    }
  }
  for (const c of ['w', 'b']) for (const t in left[c]) res[c === 'w' ? 'w' : 'b'].score += left[c][t] * VAL[t];
  return res;
}

// =================== МОРСЬКИЙ БІЙ ===================
// Класичні правила: поле 10×10; кораблі 1×4, 2×3, 3×2, 4×1; кораблі не торкаються навіть кутами;
// влучив — стріляєш ще; навколо потопленого корабля клітинки позначаються автоматично.
const FLEET = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
const LETTERS = 'АБВГДЕЖЗИК';
let B = null, aiTimer = null;

function around(i){
  const r = (i / 10) | 0, c = i % 10, res = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const r2 = r + dr, c2 = c + dc;
    if (r2 >= 0 && r2 < 10 && c2 >= 0 && c2 < 10) res.push(r2 * 10 + c2);
  }
  return res;
}
function shipCells(i, size, vert){
  const r = (i / 10) | 0, c = i % 10;
  if (vert ? r + size > 10 : c + size > 10) return null;
  return Array.from({ length: size }, (_, k) => vert ? i + 10 * k : i + k);
}
function canPlace(fleet, cells){
  const block = new Set();
  for (const sh of fleet) for (const c of sh) { block.add(c); for (const n of around(c)) block.add(n); }
  return cells.every(c => !block.has(c));
}
function randomFleet(){
  for (;;) {
    const fl = []; let ok = true;
    for (const size of FLEET) {
      let placed = false;
      for (let t = 0; t < 300 && !placed; t++) {
        const cells = shipCells(Math.floor(Math.random() * 100), size, Math.random() < .5);
        if (cells && canPlace(fl, cells)) { fl.push(cells); placed = true; }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) return fl;
  }
}
// Результат пострілу по флоту з урахуванням попередніх пострілів
function resolveShot(fleet, prevShots, i){
  if (prevShots.some(s => s.i === i)) return { i, r: 'miss' };
  const ship = fleet.find(sh => sh.includes(i));
  if (!ship) return { i, r: 'miss' };
  const hits = new Set(prevShots.filter(s => s.r !== 'miss').map(s => s.i)); hits.add(i);
  if (ship.every(c => hits.has(c))) return { i, r: 'sunk', cells: ship.slice() };
  return { i, r: 'hit' };
}
const missCount = list => list.filter(s => s.r === 'miss').length;
const sunkCount = list => list.filter(s => s.r === 'sunk').length;

function bsNew(first, round){
  clearTimeout(aiTimer);
  B = {
    round: round || Math.random().toString(36).slice(2, 10),
    first,                      // хто стріляє першим: 'host' | 'client' | 'me' | 'ai'
    fleet: [], sel: 4, vert: false, selShip: -1,
    ready: false, oppReady: S.mode === 'local',
    incoming: [],               // постріли по моєму полю (я знаю результат напевно)
    outgoing: [],               // мої постріли з відповідями суперника
    pending: null, over: null, oppFleet: null, note: '', noteCls: '',
    ai: S.mode === 'local' ? randomFleet() : null
  };
  S.rematchAsked = false;
}
function bsMe(){ return S.mode === 'local' ? 'me' : S.role; }
function bsPhase(){ return (B.ready && B.oppReady) ? 'play' : 'place'; }
// Черга визначається з історії: хто першим, той стріляє, поки промахів у обох порівну
function bsMyTurn(){
  const mm = missCount(B.outgoing), mo = missCount(B.incoming);
  return B.first === bsMe() ? mm === mo : mo > mm;
}
function bsCanShoot(){
  return B && !B.over && bsPhase() === 'play' && bsMyTurn() && !B.pending && !S.modalKind &&
    (S.mode === 'local' || S.connected);
}
function oppView(){
  const v = new Array(100).fill('');
  for (const s of B.outgoing) if (s.r === 'miss') v[s.i] = 'miss'; else if (s.r === 'hit') v[s.i] = 'hit';
  for (const s of B.outgoing) if (s.r === 'sunk') {
    for (const c of s.cells) v[c] = 'sunk';
    for (const c of s.cells) for (const n of around(c)) if (!v[n]) v[n] = 'halo';
  }
  if (B.oppFleet) for (const sh of B.oppFleet) for (const c of sh) if (!v[c]) v[c] = 'reveal';
  if (B.pending) v[B.pending.i] = 'pend';
  return v;
}
function myView(){
  const v = new Array(100).fill('');
  for (const sh of B.fleet) for (const c of sh) v[c] = 'ship';
  for (const s of B.incoming) {
    if (s.r === 'miss') v[s.i] = 'miss';
    else if (s.r === 'hit') v[s.i] = 'ship hit';
  }
  for (const s of B.incoming) if (s.r === 'sunk') {
    for (const c of s.cells) v[c] = 'sunk';
    for (const c of s.cells) for (const n of around(c)) if (!v[n]) v[n] = 'halo';
  }
  return v;
}
function shipsLeft(fleet, shots){
  const hits = new Set(shots.filter(s => s.r !== 'miss').map(s => s.i));
  return fleet.filter(sh => !sh.every(c => hits.has(c))).length;
}

// ---------- Розстановка ----------
function remaining(){
  const left = {};
  for (const s of FLEET) left[s] = (left[s] || 0) + 1;
  for (const sh of B.fleet) left[sh.length]--;
  return left;
}
function nextSize(){
  const left = remaining();
  for (const s of [4, 3, 2, 1]) if (left[s] > 0) return s;
  return 0;
}
function placeAt(i){
  const own = B.fleet.findIndex(sh => sh.includes(i));
  if (own >= 0) {                       // натиснули на свій корабель — знімаємо його
    const sh = B.fleet.splice(own, 1)[0];
    B.sel = sh.length; B.vert = sh.length > 1 && sh[1] - sh[0] === 10;
    bsRender(); return;
  }
  const size = B.sel || nextSize();
  if (!size) return;
  if (remaining()[size] <= 0) { B.sel = nextSize(); return bsRender(); }
  // Біля краю зсуваємо корабель, щоб він вмістився
  const r = (i / 10) | 0, c = i % 10;
  const start = B.vert ? Math.min(r, 10 - size) * 10 + c : r * 10 + Math.min(c, 10 - size);
  const cells = shipCells(start, size, B.vert);
  if (!cells || !canPlace(B.fleet, cells)) { toast('Тут не можна: кораблі не можуть торкатися навіть кутами'); return; }
  B.fleet.push(cells);
  B.sel = remaining()[size] > 0 ? size : nextSize();
  bsRender();
}
function bsReady(){
  if (B.fleet.length !== FLEET.length) return;
  B.ready = true;
  if (S.mode === 'net') send({ t:'bs_ready', round:B.round });
  B.note = ''; bsAfter();
}

// ---------- Постріли ----------
function bsShoot(i){
  if (!bsCanShoot()) return;
  if (oppView()[i]) return;
  if (S.mode === 'local') {
    const res = resolveShot(B.ai, B.outgoing, i);
    B.outgoing.push(res); noteMine(res); bsAfter(); return;
  }
  B.pending = { i, n: B.outgoing.length };
  send({ t:'bs_shot', i, n: B.outgoing.length, round:B.round });
  bsRender();
}
function noteMine(res){
  B.note = res.r === 'miss' ? 'Мимо' : res.r === 'hit' ? 'Влучання! Стріляй ще' : 'Корабель потоплено! Стріляй ще';
  B.noteCls = res.r === 'miss' ? '' : 'good';
}
function noteTheirs(res){
  const who = S.mode === 'local' ? 'Комп’ютер' : S.oppName;
  B.note = res.r === 'miss' ? `${who} промахнувся` : res.r === 'hit' ? `${who} влучив у твій корабель` : `${who} потопив твій корабель`;
  B.noteCls = res.r === 'miss' ? '' : 'bad';
}
function bsAfter(){
  bsCheckOver();
  bsRender();
  if (S.mode === 'local' && !B.over && bsPhase() === 'play' && !bsMyTurn()) {
    clearTimeout(aiTimer); aiTimer = setTimeout(aiShoot, 900);
  }
}
function bsCheckOver(){
  if (B.over || bsPhase() !== 'play') return;
  if (shipsLeft(B.fleet, B.incoming) === 0) bsFinish(false, 'sunk');
  else if (sunkCount(B.outgoing) >= FLEET.length) bsFinish(true, 'sunk');
}
function bsFinish(win, reason){
  if (B.over) return;
  B.over = { win, reason };
  B.pending = null; clearTimeout(aiTimer);
  if (S.mode === 'local') B.oppFleet = B.ai;
  else send({ t:'bs_reveal', fleet:B.fleet, round:B.round });
  NET.vibrate(300);
  bsRender();
  setTimeout(bsShowResult, 600);
}
function bsResultInfo(){
  const o = B.over, local = S.mode === 'local';
  if (o.win) return { title: 'Перемога! 🏆',
    why: o.reason === 'resign' ? `${esc(S.oppName)} здається.` : (local ? 'Усі кораблі комп’ютера потоплено.' : 'Усі кораблі суперника потоплено.') };
  return { title: local ? 'Комп’ютер переміг' : 'Цього разу поразка',
    why: o.reason === 'resign' ? 'Партію здано.' : 'Усі твої кораблі потоплено.' };
}
function bsShowResult(){
  if (!B || !B.over || S.modalKind) return;
  const r = bsResultInfo();
  ask('result', r.title, r.why, [
    { label:'Ще раз', cls:'gold', fn: rematch },
    { label:'Подивитися поле' },
    { label:'В меню', fn: toMenu }
  ]);
}
function bsNewRound(){
  const swap = { host:'client', client:'host', me:'me' };
  const first = swap[B ? B.first : 'me'] || 'me';
  bsNew(first, B ? B.round + 'r' : undefined);
  closeModal(); bsRender();
  if (S.mode === 'net') toast(first === S.role ? 'Новий бій. Ти стріляєш першим' : 'Новий бій. Першим стріляє ' + S.oppName);
  else toast('Новий бій');
}

// ---------- Комп'ютер ----------
function aiShoot(){
  if (!B || B.over || S.mode !== 'local' || bsMyTurn()) return;
  const shot = new Set(B.incoming.map(s => s.i));
  const blocked = new Set();
  const sunkCells = new Set();
  for (const s of B.incoming) if (s.r === 'sunk') for (const c of s.cells) { sunkCells.add(c); for (const n of around(c)) blocked.add(n); }
  const open = i => i >= 0 && i < 100 && !shot.has(i) && !blocked.has(i);
  const hits = B.incoming.filter(s => s.r === 'hit' && !sunkCells.has(s.i)).map(s => s.i);
  let cands = [];
  if (hits.length >= 2) {
    const sameRow = hits.every(h => ((h / 10) | 0) === ((hits[0] / 10) | 0));
    const sorted = hits.slice().sort((a, b) => a - b);
    const lo = sorted[0], hi = sorted[sorted.length - 1];
    if (sameRow) { if (lo % 10 > 0) cands.push(lo - 1); if (hi % 10 < 9) cands.push(hi + 1); }
    else { cands.push(lo - 10, hi + 10); }
  } else if (hits.length === 1) {
    const h = hits[0];
    if (h % 10 > 0) cands.push(h - 1);
    if (h % 10 < 9) cands.push(h + 1);
    cands.push(h - 10, h + 10);
  }
  cands = cands.filter(open);
  if (!cands.length) for (let i = 0; i < 100; i++) if (open(i)) cands.push(i);
  if (!cands.length) return;
  const i = cands[Math.floor(Math.random() * cands.length)];
  const res = resolveShot(B.fleet, B.incoming, i);
  B.incoming.push(res); noteTheirs(res);
  if (res.r !== 'miss') NET.vibrate(res.r === 'sunk' ? 200 : 60);
  bsAfter();
}

// ---------- Мережа ----------
function bsSendState(){
  send({ t:'state', game:'bs', round:B.round, first:B.first, incoming:B.incoming, ready:B.ready,
         over: B.over ? { win: !B.over.win, reason: B.over.reason } : null, name:S.myName });
}
function bsOnState(m){
  if (!B || B.round !== m.round) {
    // Цей телефон не пам'ятає цього бою (наприклад, гру перезапустили) — починаємо новий
    send({ t:'bs_lost' });
    return;
  }
  bsApplySync(m.incoming, m.ready, m.over);
  send({ t:'bs_sync', round:B.round, incoming:B.incoming, ready:B.ready,
         over: B.over ? { win: !B.over.win, reason: B.over.reason } : null });
  const was = inGame();
  enterGame();
  if (was) toast('Зв’язок відновлено');
}
function bsApplySync(incoming, ready, over){
  B.outgoing = (incoming || []).map(s => ({ i:s.i, r:s.r, cells:s.cells }));
  B.oppReady = !!ready;
  B.pending = null;
  if (over && !B.over) { B.over = over; }
  bsCheckOver();
}
function bsMsg(m){
  if (!B) return;
  if (m.t === 'bs_lost') { if (S.role === 'host') { toast('Починаємо новий бій'); startNetGame(); } return; }
  if (m.round && m.round !== B.round) { if (m.t !== 'bs_reveal') bsResync(); return; }
  switch (m.t) {
    case 'bs_ready':
      if (!B.oppReady) { B.oppReady = true; if (!B.ready) toast(`${S.oppName} вже розставив кораблі`); }
      bsAfter();
      break;
    case 'bs_shot': {
      if (m.n < B.incoming.length) { send({ t:'bs_res', round:B.round, n:m.n, ...B.incoming[m.n] }); return; }
      if (m.n > B.incoming.length || bsPhase() !== 'play' || bsMyTurn() || B.over) { bsResync(); return; }
      const res = resolveShot(B.fleet, B.incoming, m.i);
      B.incoming.push(res);
      send({ t:'bs_res', round:B.round, n:m.n, ...res });
      noteTheirs(res);
      NET.vibrate(res.r === 'miss' ? 30 : res.r === 'sunk' ? 220 : 90);
      bsAfter();
      break;
    }
    case 'bs_res':
      if (m.n < B.outgoing.length) return;
      if (m.n > B.outgoing.length) { bsResync(); return; }
      B.outgoing.push({ i:m.i, r:m.r, cells:m.cells });
      B.pending = null; noteMine(m); bsAfter();
      break;
    case 'bs_sync':
      bsApplySync(m.incoming, m.ready, m.over); bsRender();
      break;
    case 'bs_reveal':
      B.oppFleet = m.fleet; bsRender();
      break;
  }
}
function bsResync(){ if (S.role === 'host') bsSendState(); else send({ t:'needState' }); }

// ---------- Малювання ----------
function gridHtml(view, who, clickable, extra){
  let h = `<div class="bsgrid ${extra || ''}" data-g="${who}"><div class="lb"></div>`;
  for (let c = 0; c < 10; c++) h += `<div class="lb">${LETTERS[c]}</div>`;
  for (let r = 0; r < 10; r++) {
    h += `<div class="lb">${r + 1}</div>`;
    for (let c = 0; c < 10; c++) {
      const i = r * 10 + c;
      h += `<div class="c ${view[i]}"${clickable ? ` data-c="${i}"` : ''}></div>`;
    }
  }
  return h + '</div>';
}
function bsRender(){
  if (!B) return;
  const el = $('bsBody'); let h = '';
  const phase = bsPhase();
  const opp = S.mode === 'local' ? 'Комп’ютер' : S.oppName;

  if (phase === 'place' && !B.ready) {
    const left = remaining();
    h += `<div class="gw-mid bshead"><span>Розстав свої кораблі</span><small>${B.fleet.length} з ${FLEET.length}</small></div>`;
    h += `<div class="bsnote">Вибери корабель і торкнись клітинки. Торкнись корабля на полі, щоб прибрати.</div>`;
    h += `<div class="gw-mid">${gridHtml(myView(), 'me', true)}</div>`;
    h += '<div class="gw-mid tray">';
    for (const s of [4, 3, 2, 1]) {
      h += `<button data-s="${s}" class="${B.sel === s && left[s] > 0 ? 'on' : ''}" ${left[s] > 0 ? '' : 'disabled'}>` +
           `<span class="blk">${'<i></i>'.repeat(s)}</span>×${left[s]}</button>`;
    }
    h += `<button data-rot="1">${B.vert ? '↕ Вертикально' : '↔ Горизонтально'}</button></div>`;
    if (S.mode === 'net' && B.oppReady) h += `<div class="bsnote">${esc(opp)} вже готовий до бою</div>`;
    h += actionsHtml([['random', '🎲', 'Випадково'], ['clear', '🧹', 'Очистити', false, !B.fleet.length],
                      ['ready', '⚓', 'До бою!', true, B.fleet.length !== FLEET.length], ['menu', '☰', 'Меню']], 'gw-mid');
  } else {
    const my = bsMyTurn();
    let st, cls = '';
    if (B.over) { st = bsResultInfo().title; cls = B.over.win ? 'good' : 'bad'; }
    else if (phase === 'place') st = `Чекаю, поки ${opp} розставить кораблі…`;
    else if (S.mode === 'net' && !S.connected) st = 'Немає зв’язку';
    else if (my) st = B.pending ? 'Постріл…' : 'Твій постріл! Обери клітинку';
    else st = S.mode === 'local' ? 'Стріляє комп’ютер…' : `Стріляє ${opp}…`;
    if (my && phase === 'play' && !B.over) cls = 'good';
    h += `<div id="bsStatus" class="${cls}">${esc(st)}</div>`;
    h += `<div class="bsnote ${B.noteCls}">${esc(B.note || '')}</div>`;
    h += `<div class="gw-big bshead"><span>Флот: ${esc(opp)}</span><small>кораблів залишилось: ${FLEET.length - sunkCount(B.outgoing)}</small></div>`;
    h += `<div class="gw-big">${gridHtml(oppView(), 'opp', true, my && phase === 'play' && !B.over ? 'turn' : '')}</div>`;
    h += `<div class="gw-small bshead"><span>Мій флот</span><small>${shipsLeft(B.fleet, B.incoming)} з ${FLEET.length}</small></div>`;
    h += `<div class="gw-small">${gridHtml(myView(), 'me', false)}</div>`;
    const acts = B.over
      ? [['again', S.rematchAsked ? '⏳' : '🔁', S.rematchAsked ? 'Чекаю…' : 'Ще раз', true], ['result', '🏁', 'Результат'], ['menu', '☰', 'Меню']]
      : [['resign', '🏳️', 'Здатися', false, phase !== 'play' || (S.mode === 'net' && !S.connected)], ['menu', '☰', 'Меню']];
    h += actionsHtml(acts, 'gw-big');
  }
  el.innerHTML = h;
}
function actionsHtml(a, gw){
  return `<div class="${gw} actions bsgame-actions" style="width:var(--gw)">` + a.map(([id, ic, lb, gold, dis]) =>
    `<button data-a="${id}" class="${gold ? 'gold' : ''}" ${dis ? 'disabled' : ''}><span>${ic}</span>${lb}</button>`).join('') + '</div>';
}
$('bsBody').addEventListener('click', e => {
  if (!B) return;
  const a = e.target.closest('[data-a]');
  if (a) { if (!a.disabled) bsAct(a.dataset.a); return; }
  const s = e.target.closest('[data-s]');
  if (s) { if (!s.disabled) { B.sel = +s.dataset.s; bsRender(); } return; }
  if (e.target.closest('[data-rot]')) { B.vert = !B.vert; bsRender(); return; }
  const cell = e.target.closest('[data-c]');
  if (!cell) return;
  const g = cell.parentElement.dataset.g, i = +cell.dataset.c;
  if (g === 'me' && bsPhase() === 'place' && !B.ready) placeAt(i);
  else if (g === 'opp') bsShoot(i);
});
function bsAct(id){
  if (id === 'menu') return confirmLeave();
  if (id === 'random') { B.fleet = randomFleet(); B.sel = 0; return bsRender(); }
  if (id === 'clear') { B.fleet = []; B.sel = 4; return bsRender(); }
  if (id === 'ready') return bsReady();
  if (id === 'again') return rematch();
  if (id === 'result') return bsShowResult();
  if (id === 'resign') return ask('resign', 'Здатися?', 'Точно здати бій?', [
    { label:'Так, здаюся', cls:'gold', fn: () => { if (S.mode === 'net') send({ t:'resign' }); bsFinish(false, 'resign'); } },
    { label:'Ні, граю далі' }]);
}

// ---------- Кнопка «Назад» на телефоні ----------
function onBack(){
  if (S.modalKind) { if (S.modalKind === 'promo') { S.selected = null; render(); } closeModal(); return; }
  if (inGame()) return confirmLeave();
  if (S.screen === 'host' || S.screen === 'join') return toMenu();
  if (S.screen === 'pick') return show('menu');
  NET.exit();
}
</script>
</body>
</html>
