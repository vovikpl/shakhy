plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.family.shakhy'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.family.shakhy'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Постійний ключ підпису: нові версії ставляться поверх старих без видалення
    signingConfigs {
        family {
            storeFile file('shakhy.keystore')
            storePassword 'shakhy123'
            keyAlias 'shakhy'
            keyPassword 'shakhy123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.family }
        release {
            minifyEnabled false
            signingConfig signingConfigs.family
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
