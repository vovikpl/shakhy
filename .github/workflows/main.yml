name: Зібрати APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Збірка
        run: gradle assembleRelease --no-daemon

      - name: Підготувати файл
        run: cp app/build/outputs/apk/release/app-release.apk Shakhy.apk

      - name: Зберегти APK
        uses: actions/upload-artifact@v4
        with:
          name: Shakhy-apk
          path: Shakhy.apk

      - name: Опублікувати у Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Шахи, збірка ${{ github.run_number }}
          files: Shakhy.apk
