name: Зібрати APK і AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Збірка (APK для телефонів, AAB для Google Play)
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Підготувати файли
        run: |
          cp app/build/outputs/apk/release/app-release.apk PairPlay.apk
          cp app/build/outputs/bundle/release/app-release.aab PairPlay-GooglePlay.aab

      - name: Опублікувати у Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pair Play, збірка ${{ github.run_number }}
          files: |
            PairPlay.apk
            PairPlay-GooglePlay.aab
